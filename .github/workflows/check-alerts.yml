name: Check price alerts (evaluación, cada 4h)

on:
  schedule:
    - cron: "0 */4 * * *"   # cada 4 horas, mismo ritmo que el bot de Pools
  workflow_dispatch: {}      # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: check-alerts
  cancel-in-progress: false

jobs:
  check-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run check-alerts.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APININJAS_KEY: ${{ secrets.APININJAS_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: node check-alerts.js
