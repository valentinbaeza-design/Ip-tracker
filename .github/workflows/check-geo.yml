name: Check geopolitical context (diario)

on:
  schedule:
    - cron: "0 8 * * *"   # una vez al día, 08:00 UTC — esta API sí tiene coste, no conviene más frecuencia
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para guardar geo-log.json en el repo

jobs:
  check-geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run check-geo.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node check-geo.js
      - name: Guardar geo-log.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geo-log.json
          git diff --staged --quiet || git commit -m "Actualizar geo-log.json"
          git push
