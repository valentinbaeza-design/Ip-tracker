name: Check geopolitical context (diario)

on:
  schedule:
    - cron: "10 8 * * *"   # 08:10 UTC (no 08:00 en punto) — reduce la probabilidad de coincidir
                            # con check.yml/check-alerts.yml, que corren cada 4h en el minuto 0.
                            # Sigue siendo 1 vez/día; esta API sí tiene coste, no conviene más frecuencia
  workflow_dispatch: {}

permissions:
  contents: write   # necesario para guardar geo-log.json en el repo

concurrency:
  group: check-geo
  cancel-in-progress: false

jobs:
  check-geo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run check-geo.js
        id: run_check
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node check-geo.js
      - name: Guardar geo-log.json si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geo-log.json
          if git diff --staged --quiet; then
            echo "Sin cambios en geo-log.json, nada que subir."
            exit 0
          fi
          git commit -m "Actualizar geo-log.json"
          n=0
          until git push || [ $n -ge 3 ]; do
            n=$((n+1))
            echo "Push rechazado (intento $n/3), reintentando tras sincronizar con origin..."
            sleep $((RANDOM % 10 + 1))
            git pull --rebase origin main
          done
      - name: Marcar la ejecución como fallida si check-geo.js falló
        if: steps.run_check.outcome == 'failure'
        run: |
          echo "check-geo.js terminó con error (ver log del paso anterior) — geo-log.json ya se guardó, pero esta ejecución se marca como fallida para que se note."
          exit 1
