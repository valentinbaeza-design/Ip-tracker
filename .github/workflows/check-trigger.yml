name: Check price trigger (rápido)

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min — usa API Ninjas, no oilpriceapi (cuota insuficiente a esta cadencia)
  workflow_dispatch: {}

jobs:
  check-trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run check-trigger.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APININJAS_KEY: ${{ secrets.APININJAS_KEY }}
        run: node check-trigger.js
