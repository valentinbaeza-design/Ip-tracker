<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel LP — Valentín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151b; --surface:#1a1e26; --surface2:#20242e; --border:#2a2f3a;
    --text:#eef1f5; --muted:#8b93a3; --muted2:#5f6675;
    --gold:#d4a13d; --gold-dim:#8a6c2f;
    --teal:#4fb0a8; --coral:#e2685a;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  #root{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

  .hdr{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px;border-bottom:1px solid var(--border);padding-bottom:16px;}
  .hdr h1{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;margin:0;letter-spacing:-0.01em;}
  .hdr .tag{font-size:11px;color:var(--gold);font-family:'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;}
  .sub{color:var(--muted);font-size:13px;margin-top:6px;}

  .tabs{display:flex;gap:2px;margin:18px 0 20px;overflow-x:auto;border-bottom:1px solid var(--border);}
  .tab{padding:10px 14px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;}
  .tab.active{color:var(--gold);border-bottom-color:var(--gold);}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .card h2{font-family:'Space Grotesk',sans-serif;font-size:14px;margin:0 0 12px;color:var(--text);display:flex;align-items:center;justify-content:space-between;}
  .card h2 .num{font-family:'IBM Plex Mono',monospace;color:var(--muted2);font-size:11px;font-weight:400;}
  .pos-table-wrap{overflow-x:auto;margin:0 calc(-50vw + 50%) 12px;width:100vw;padding:0 16px;box-sizing:border-box;}
  .pos-table{width:100%;min-width:1150px;border-collapse:collapse;font-size:12px;white-space:nowrap;}
  .pos-table th,.pos-table td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border);}
  .pos-table th:first-child,.pos-table td:first-child{text-align:left;}
  .pos-table th{color:var(--muted);font-weight:600;cursor:pointer;user-select:none;font-family:'IBM Plex Mono',monospace;font-size:11px;}
  .pos-table th:hover{color:var(--gold);}
  .pos-table th .sort-arrow{opacity:0.5;margin-left:3px;}
  .pos-table td{font-family:'IBM Plex Mono',monospace;}
  .pos-table td.name-cell{font-family:'Space Grotesk',sans-serif;}
  .pos-table tbody tr:hover{background:rgba(255,255,255,0.02);}
  .pos-table tfoot td{border-bottom:none;padding-top:10px;}

  .row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
  .row:last-child{border-bottom:none;}
  .row .l{color:var(--muted);}
  .row .r{font-family:'IBM Plex Mono',monospace;color:var(--text);text-align:right;}
  .row .r small{color:var(--muted2);margin-left:6px;}

  .chip{display:inline-block;font-size:10px;padding:2px 8px;border-radius:20px;font-family:'IBM Plex Mono',monospace;letter-spacing:.03em;}
  .chip.in{background:rgba(79,176,168,.15);color:var(--teal);}
  .chip.out{background:rgba(226,104,90,.15);color:var(--coral);}

  input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:6px;font-family:'IBM Plex Mono',monospace;font-size:12px;}
  input[type=text]:focus{outline:none;border-color:var(--gold-dim);}
  label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}

  button{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;border:none;border-radius:7px;padding:9px 14px;cursor:pointer;}
  .btn-gold{background:var(--gold);color:#1a1508;}
  .btn-gold:hover{background:#e0ac47;}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--gold-dim);}
  .btn-sm{padding:6px 10px;font-size:12px;}
  a.link-btn{display:inline-block;text-decoration:none;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media(max-width:560px){.grid2{grid-template-columns:1fr;}}

  .muted{color:var(--muted);font-size:12px;line-height:1.5;}
  .err{color:var(--coral);font-size:12px;}
  .ok{color:var(--teal);font-size:12px;}

  .steplist{counter-reset:step;list-style:none;padding:0;margin:0;}
  .steplist li{counter-increment:step;position:relative;padding:8px 0 8px 30px;border-bottom:1px solid var(--border);font-size:13px;line-height:1.5;}
  .steplist li:last-child{border-bottom:none;}
  .steplist li::before{content:counter(step);position:absolute;left:0;top:8px;width:20px;height:20px;background:var(--surface2);border:1px solid var(--gold-dim);color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;border-radius:5px;display:flex;align-items:center;justify-content:center;}
  .steplist code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--gold);}

  .manual-step{border-bottom:1px solid var(--border);padding:4px 0;}
  .manual-step:last-child{border-bottom:none;}
  .manual-step summary{cursor:pointer;padding:9px 4px;font-size:13px;font-weight:600;list-style:none;display:flex;align-items:center;color:var(--text);}
  .manual-step summary::-webkit-details-marker{display:none;}
  .manual-step summary::before{content:"▸";color:var(--gold);margin-right:8px;transition:transform .15s;}
  .manual-step[open] summary::before{transform:rotate(90deg);}
  .manual-step p{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 10px 20px;}
  .manual-step code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px;color:var(--gold);}

  .chatwrap{display:flex;flex-direction:column;height:480px;}
  .chatlog{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:85%;padding:9px 12px;border-radius:10px;font-size:13px;line-height:1.5;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--gold);color:#1a1508;font-weight:500;}
  .msg.assistant{align-self:flex-start;background:var(--surface2);border:1px solid var(--border);}
  .chatinput{display:flex;gap:8px;margin-top:10px;}
  .chatinput input{flex:1;}

  .loader{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* Tooltip enriquecido: envuelve un elemento con .ttip y añade dentro un .ttip-card con el contenido.
     Usa position:fixed (no absolute) porque el contenedor de la tabla tiene scroll horizontal,
     y eso obliga a recortar también el eje vertical si el tooltip fuera absolute — con fixed,
     la posición real en pantalla se calcula por JS al abrirse, así que escapa de ese recorte. */
  .ttip{position:relative;cursor:help;border-bottom:1px dotted var(--muted2);}
  .ttip .ttip-card{
    display:none;position:fixed;z-index:200;width:280px;padding:12px 14px;
    background:var(--surface2);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);text-align:left;white-space:normal;font-weight:400;
  }
  .ttip:hover .ttip-card, .ttip:focus .ttip-card, .ttip.ttip-open .ttip-card{display:block;}
  .ttip-card .ttip-title{font-weight:700;color:var(--text);font-size:12px;margin-bottom:6px;}
  .ttip-card .ttip-row{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:3px 0;color:var(--text);font-weight:600;}
  .ttip-card .ttip-row b{color:var(--text);font-weight:700;}
  .ttip-card .ttip-note{font-size:10px;color:var(--text);font-weight:600;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);font-style:italic;}
  @media (max-width:560px){ .ttip .ttip-card{ width:220px; } }

  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>

// ---------- Utilidades de almacenamiento ----------
// Dentro de Claude.ai (artifact) usa window.storage; fuera (archivo local / hosting propio) cae a localStorage.
const IN_ARTIFACT = typeof window.storage !== "undefined";
async function storeGet(key, fallback){
  try{
    if(IN_ARTIFACT){ const r = await window.storage.get(key); return r ? JSON.parse(r.value) : fallback; }
    const v = localStorage.getItem("panel-lp:" + key);
    return v !== null ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
async function storeSet(key, value){
  try{
    if(IN_ARTIFACT){ await window.storage.set(key, JSON.stringify(value)); }
    else{ localStorage.setItem("panel-lp:" + key, JSON.stringify(value)); }
  }catch(e){}
}

// ---------- Cifrado local de la clave API (solo modo standalone) ----------
async function deriveKey(passphrase, saltB64){
  const enc = new TextEncoder();
  const salt = saltB64 ? Uint8Array.from(atob(saltB64), c => c.charCodeAt(0)) : crypto.getRandomValues(new Uint8Array(16));
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
    baseKey, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
  return { key, saltB64: btoa(String.fromCharCode(...salt)) };
}
async function encryptApiKey(apiKey, passphrase){
  const { key, saltB64 } = await deriveKey(passphrase);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const enc = new TextEncoder();
  const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(apiKey));
  return { ciphertext: btoa(String.fromCharCode(...new Uint8Array(ciphertext))), iv: btoa(String.fromCharCode(...iv)), salt: saltB64 };
}
async function decryptApiKey(blob, passphrase){
  const { key } = await deriveKey(passphrase, blob.salt);
  const iv = Uint8Array.from(atob(blob.iv), c => c.charCodeAt(0));
  const ciphertext = Uint8Array.from(atob(blob.ciphertext), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
  return new TextDecoder().decode(plain);
}

function utf8ToBase64(str){
  return btoa(unescape(encodeURIComponent(str)));
}

// Escribe (crea o actualiza) un archivo en el repo vía la API de Contents de GitHub.
// Si el archivo ya existe, necesita su sha actual para actualizar sin sobrescribir a ciegas.
// Si no existe (HTTP 404 al leer), lo crea directamente sin sha.
async function githubPutFile(path, contentObj, commitMessage){
  if(!state.githubTokenPlain) throw new Error("Token de GitHub no desbloqueado.");
  const url = `https://api.github.com/repos/${GITHUB_REPO}/contents/${path}`;
  const headers = {
    "Authorization": `Bearer ${state.githubTokenPlain}`,
    "Accept": "application/vnd.github+json",
    "X-GitHub-Api-Version": "2022-11-28"
  };
  const getRes = await fetch(url, { headers });
  let sha = undefined;
  if(getRes.status === 404){
    sha = undefined; // el archivo no existe todavía — se crea sin sha
  } else if(!getRes.ok){
    throw new Error(`No se pudo leer ${path} para obtener su sha (HTTP ${getRes.status}). Verifica que el token tenga acceso a este repo.`);
  } else {
    const getJson = await getRes.json();
    sha = getJson.sha;
  }
  const content = JSON.stringify(contentObj, null, 2) + "\n";
  const putRes = await fetch(url, {
    method: "PUT",
    headers: { ...headers, "Content-Type": "application/json" },
    body: JSON.stringify({ message: commitMessage, content: utf8ToBase64(content), ...(sha ? { sha } : {}), branch: "main" })
  });
  if(!putRes.ok){
    const errText = await putRes.text();
    throw new Error(`Error al escribir ${path} (HTTP ${putRes.status}): ${errText.slice(0, 200)}`);
  }
  return true;
}

function getInstrument(key){ return state.instruments[key]; }

// ---------- Posiciones: config.json como fuente única (bot + panel) ----------
// === CONFIG_ROUNDTRIP_START ===
// Convierte una entrada de config.json (esquema del bot) al formato que usa el panel para pintar la tabla.
function configEntryToPosition(cfg){
  const unit = cfg.rangeUnitLabel || "USDC/WETH";
  const rangeStr = (cfg.rangeMin != null && cfg.rangeMax != null)
    ? `${cfg.rangeMin.toLocaleString("es-ES")} – ${cfg.rangeMax.toLocaleString("es-ES")} ${unit}${cfg.rangeSuffix ? " " + cfg.rangeSuffix : ""}`
    : (cfg.range || "—");
  const depositStr = cfg.initialUSD != null ? `${cfg.initialUSD.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} US$` : (cfg.deposit || "—");
  return {
    id: String(cfg.tokenId), pair: cfg.label ? cfg.label.split("·")[0].trim() : cfg.pair, network: cfg.network || (cfg.label && cfg.label.includes("·") ? cfg.label.split("·")[1].trim() : ""),
    fee: cfg.feeTierLabel || cfg.fee || "0.3%", range: rangeStr, deposit: depositStr,
    rangeMin: cfg.rangeMin, rangeMax: cfg.rangeMax, priceMode: cfg.priceMode || "direct",
    priceSymbols: cfg.priceSymbols || ["ETHUSDT"], analysisSymbol: cfg.analysisSymbol || "ETHUSDT",
    rpc: cfg.rpc, positionManager: cfg.positionManager, factory: cfg.factory, chainSlug: cfg.chainSlug,
    initialUSD: cfg.initialUSD, openedAt: cfg.openedAt || null, note: cfg.note || "",
    entryPrice: cfg.entryPrice != null ? cfg.entryPrice : null,
    entryPriceUsed: cfg.entryPrice != null
  };
}
// Convierte una posición del panel de vuelta al esquema config.json (lo que lee check-positions.js).
function positionToConfigEntry(p){
  return {
    label: `${p.pair} · ${p.network}`, tokenId: isNaN(Number(p.id)) ? p.id : Number(p.id),
    rpc: p.rpc, positionManager: p.positionManager, factory: p.factory, chainSlug: p.chainSlug,
    initialUSD: p.initialUSD, openedAt: p.openedAt || undefined, note: p.note || undefined,
    feeTierLabel: p.fee, rangeMin: p.rangeMin, rangeMax: p.rangeMax,
    priceMode: p.priceMode, priceSymbols: p.priceSymbols, analysisSymbol: p.analysisSymbol,
    entryPrice: p.entryPrice != null ? p.entryPrice : undefined
  };
}
// === CONFIG_ROUNDTRIP_END ===

// === CARTERA_AGGREGATION_START ===
// Auditoría del 24/8: mismo bug de Fase 1 (una suma parcial presentada como si fuera
// completa) encontrado en la pestaña Cartera. Si algunos holdings de una clase (o de la
// cartera entera) no tienen precio en vivo disponible todavía, la suma de los que SÍ lo
// tienen se mostraba tal cual, sin ningún aviso — indistinguible de un total real.
// Esta función agrega el valor y devuelve explícitamente si el resultado es parcial,
// vacío (sin holdings) o totalmente desconocido (hay holdings pero ninguno con precio).
function aggregateHoldingsCurrentValue(holdingsSubset){
  const withValue = holdingsSubset.filter(h => h.current != null);
  const total = holdingsSubset.length;
  const known = withValue.length;
  const isEmpty = total === 0;
  const isFullyUnknown = total > 0 && known === 0;
  const isPartial = known > 0 && known < total;
  const sum = known > 0 ? withValue.reduce((a, h) => a + h.current, 0) : (isEmpty ? 0 : null);
  return { sum, isPartial, isEmpty, isFullyUnknown, total, known };
}
// === CARTERA_AGGREGATION_END ===
// Lee config.json del repo (API de contenidos de GitHub; usa el token si está desbloqueado
// para mayor límite de peticiones, pero funciona sin él porque el repo es público).
async function fetchPositionsConfig(){
  setState({ positionsSyncStatus: "Sincronizando…" });
  try{
    const headers = { "Accept": "application/vnd.github.v3.raw" };
    if(state.githubTokenPlain) headers["Authorization"] = `Bearer ${state.githubTokenPlain}`;
    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/config.json`, { headers, cache: "no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const entries = (json.positions || []).map(configEntryToPosition);
    if(entries.length === 0) throw new Error("config.json no tiene posiciones");
    POSITIONS = entries;
    await storeSet("lp-positions-config", json);
    setState({ positionsSyncStatus: `Sincronizado desde GitHub — ${new Date().toLocaleTimeString("es-ES")}` });
    fetchPositionPrices();
    fetchPerformance();
  }catch(e){
    setState({ positionsSyncStatus: `No se pudo sincronizar desde GitHub (${e.message}) — usando última copia local.` });
  }
}
// Escribe el estado actual de POSITIONS en config.json del repo (requiere token desbloqueado).
async function syncPositionsToGithub(commitMessage){
  const payload = { positions: POSITIONS.map(positionToConfigEntry) };
  await githubPutFile("config.json", payload, commitMessage);
  await storeSet("lp-positions-config", payload);
}

// ---------- Balance LP: historial de posiciones cerradas (closed-positions.json) ----------
async function fetchClosedPositions(){
  setState({ closedPositionsSyncStatus: "Sincronizando…" });
  try{
    const headers = { "Accept": "application/vnd.github.v3.raw" };
    if(state.githubTokenPlain) headers["Authorization"] = `Bearer ${state.githubTokenPlain}`;
    const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/closed-positions.json`, { headers, cache: "no-store" });
    if(res.status === 404){
      // El archivo aún no existe en el repo — no es un error, simplemente no hay cierres registrados todavía.
      setState({ closedPositions: [], closedPositionsFileExists: false, closedPositionsSyncStatus: "Sin closed-positions.json en el repo todavía (se creará al registrar el primer cierre)." });
      return;
    }
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const json = await res.json();
    const list = json.closed || [];
    setState({ closedPositions: list, closedPositionsFileExists: true, closedPositionsSyncStatus: `Sincronizado desde GitHub — ${new Date().toLocaleTimeString("es-ES")}` });
    await storeSet("lp-closed-positions", list);
  }catch(e){
    setState({ closedPositionsSyncStatus: `No se pudo sincronizar desde GitHub (${e.message}) — usando última copia local.` });
  }
}

function daysActive(openedAtIso, closedAtIso){
  if(!openedAtIso) return null;
  const start = new Date(openedAtIso).getTime();
  const end = closedAtIso ? new Date(closedAtIso).getTime() : Date.now();
  if(isNaN(start) || isNaN(end)) return null;
  return (end - start) / (1000 * 60 * 60 * 24);
}

function holdingCurrentValueEUR(h){
  if(h.valuationMode === "binance"){
    const priceUSD = state.portfolioLivePrices ? state.portfolioLivePrices[h.symbol] : null;
    if(priceUSD == null || !h.units || !state.eurRate) return null;

  if(h.valuationMode === "gold"){

    if(priceUSD == null || !h.units || !state.eurRate) return null;
    return h.units * priceUSD * state.eurRate;
  }
  // manual: usa el último valor que el usuario haya introducido, o el importe invertido si no ha actualizado nunca
  return h.manualCurrentValueEUR != null && h.manualCurrentValueEUR !== "" ? Number(h.manualCurrentValueEUR) : h.investedEUR;

// Calendario de aportaciones: mes 0 es la aportación inicial, los siguientes son la mensual.
// Compara lo planificado (según el reparto objetivo) con lo realmente invertido (sumando
// holdings cuya fecha cae en ese mes), sin necesidad de marcar nada a mano.
function buildContributionSchedule(){
  const plan = state.portfolioPlan;
  const alloc = state.portfolio.allocations;
  const start = new Date(plan.startDate + "T00:00:00");
  const months = [];
  const n = Math.max(1, parseInt(plan.monthsAhead, 10) || 12);
  for(let i = 0; i <= n; i++){
    // mes 0 = aportación inicial (mismo mes de inicio); mes 1..n = los siguientes meses naturales
    const d = i === 0 ? new Date(start.getFullYear(), start.getMonth(), 1) : new Date(start.getFullYear(), start.getMonth() + i, 1);
    const monthLabel = d.toLocaleDateString("es-ES", { month: "short", year: "numeric" });
    const amount = i === 0 ? Number(plan.initialAmount) || 0 : Number(plan.monthlyAmount) || 0;
    const kind = i === 0 ? "inicial" : "mensual";
    const targets = ASSET_CLASSES.map(c => ({ key: c.key, label: c.label, planned: amount * (Number(alloc[c.key]) || 0) / 100 }));
    const actualByKey = {};
    ASSET_CLASSES.forEach(c => {
      actualByKey[c.key] = state.portfolioHoldings
        .filter(h => h.assetKey === c.key)
        .filter(h => { const hd = new Date(h.date + "T00:00:00"); return hd.getFullYear() === d.getFullYear() && hd.getMonth() === d.getMonth(); })
        .reduce((a, h) => a + (Number(h.investedEUR) || 0), 0);
    });
    months.push({ index: i, kind, monthLabel, year: d.getFullYear(), month: d.getMonth(), amount, targets, actualByKey });
  }
  return months;
}

function drawInstrumentHistory(){
  const instr = getActiveInstrument();
  const canvas = document.getElementById("instrument-history-canvas");
  if(!canvas || !instr || !instr.history || instr.history.length < 2) return;
  const series = instr.history;
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 600, cssHeight = 220;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const padLeft = 6, padRight = 56, padTop = 10, padBottom = 10;
  const plotW = cssWidth - padLeft - padRight, plotH = cssHeight - padTop - padBottom;
  let min = Infinity, max = -Infinity;
  series.forEach(p => { if(p.price < min) min = p.price; if(p.price > max) max = p.price; });
  const pad = (max - min) * 0.1 || max * 0.01;
  min -= pad; max += pad;
  const yOf = v => padTop + plotH - ((v - min) / (max - min)) * plotH;
  const xOf = i => padLeft + (i / (series.length - 1)) * plotW;

  ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = 1; ctx.font = "10px IBM Plex Mono"; ctx.fillStyle = "#5f6675";
  for(let i = 0; i <= 3; i++){
    const y = padTop + (plotH / 3) * i;
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(padLeft + plotW, y); ctx.stroke();
    const val = max - ((max - min) / 3) * i;
    ctx.fillText("$" + val.toFixed(3), padLeft + plotW + 6, y + 3);
  }

  const up = series[series.length - 1].price >= series[0].price;
  ctx.strokeStyle = up ? "#4fb0a8" : "#e2685a"; ctx.lineWidth = 1.8;
  ctx.beginPath();
  series.forEach((p, i) => { const x = xOf(i), y = yOf(p.price); if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
  ctx.stroke();

  ctx.fillStyle = ctx.strokeStyle;
  const lastX = xOf(series.length - 1), lastY = yOf(series[series.length - 1].price);
  ctx.beginPath(); ctx.arc(lastX, lastY, 3, 0, Math.PI * 2); ctx.fill();
}

function ema(candles, period){
  const k = 2 / (period + 1);
  const out = new Array(candles.length).fill(null);
  let prev = null;
  for(let i = 0; i < candles.length; i++){
    if(i < period - 1) continue;
    if(prev === null){
      let sum = 0; for(let j = i - period + 1; j <= i; j++) sum += candles[j].c;
      prev = sum / period;
    } else {
      prev = candles[i].c * k + prev * (1 - k);
    }
    out[i] = prev;
  }
  return out;
}
function macd(candles){
  const ema12 = ema(candles, 12), ema26 = ema(candles, 26);
  const macdLine = candles.map((c, i) => (ema12[i] !== null && ema26[i] !== null) ? ema12[i] - ema26[i] : null);
  const validPoints = macdLine.filter(v => v !== null);
  const signalRaw = [];
  let prevSignal = null;
  const k = 2 / (9 + 1);
  let count = 0;
  const signalLine = new Array(candles.length).fill(null);
  for(let i = 0; i < macdLine.length; i++){
    if(macdLine[i] === null) continue;
    count++;
    if(count < 9) continue;
    if(prevSignal === null){
      let sum = 0, c2 = 0;
      for(let j = i; j >= 0 && c2 < 9; j--){ if(macdLine[j] !== null){ sum += macdLine[j]; c2++; } }
      prevSignal = sum / 9;
    } else {
      prevSignal = macdLine[i] * k + prevSignal * (1 - k);
    }
    signalLine[i] = prevSignal;
  }
  const histogram = candles.map((c, i) => (macdLine[i] !== null && signalLine[i] !== null) ? macdLine[i] - signalLine[i] : null);
  return { macdLine, signalLine, histogram };
}
function bollinger(candles, period = 20, mult = 2){
  const mid = sma(candles, period);
  const upper = new Array(candles.length).fill(null), lower = new Array(candles.length).fill(null);
  for(let i = period - 1; i < candles.length; i++){
    let sumSq = 0;
    for(let j = i - period + 1; j <= i; j++) sumSq += Math.pow(candles[j].c - mid[i], 2);
    const std = Math.sqrt(sumSq / period);
    upper[i] = mid[i] + mult * std;
    lower[i] = mid[i] - mult * std;
  }
  return { mid, upper, lower };
}
function atr(candles, period = 14){
  if(candles.length < period + 1) return null;
  const trs = [];
  for(let i = 1; i < candles.length; i++){
    const c = candles[i], prev = candles[i - 1];
    trs.push(Math.max(c.h - c.l, Math.abs(c.h - prev.c), Math.abs(c.l - prev.c)));
  }
  const lastN = trs.slice(-period);
  return lastN.reduce((a, b) => a + b, 0) / lastN.length;
}

function drawCandlesReal(canvasId, candles){
  const canvas = document.getElementById(canvasId);
  if(!canvas || !candles || candles.length < 2) return;
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 600, cssHeight = 260;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const padLeft = 6, padRight = 56;
  const plotW = cssWidth - padLeft - padRight;
  const n = candles.length;
  const slot = plotW / n;
  const candleW = Math.max(1.5, slot * 0.6);
  let min = Infinity, max = -Infinity;
  candles.forEach(c => { if(c.l < min) min = c.l; if(c.h > max) max = c.h; });
  const pad = (max - min) * 0.08 || max * 0.01;
  min -= pad; max += pad;
  const yOf = v => cssHeight - ((v - min) / (max - min)) * cssHeight;

  ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = 1; ctx.font = "10px IBM Plex Mono"; ctx.fillStyle = "#5f6675";
  for(let i = 0; i <= 4; i++){
    const y = (cssHeight / 4) * i;
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(padLeft + plotW, y); ctx.stroke();
    const val = max - ((max - min) / 4) * i;
    ctx.fillText(val.toFixed(2), padLeft + plotW + 6, y + 3);
  }
  candles.forEach((c, i) => {
    const x = padLeft + i * slot + slot / 2;
    const up = c.c >= c.o;
    ctx.strokeStyle = ctx.fillStyle = up ? "#4fb0a8" : "#e2685a";
    ctx.beginPath(); ctx.moveTo(x, yOf(c.h)); ctx.lineTo(x, yOf(c.l)); ctx.stroke();
    const bodyTop = yOf(Math.max(c.o, c.c)), bodyBot = yOf(Math.min(c.o, c.c));
    ctx.fillRect(x - candleW / 2, bodyTop, candleW, Math.max(1, bodyBot - bodyTop));
  });
  function drawLine(series, color){
    ctx.strokeStyle = color; ctx.lineWidth = 1.3; ctx.beginPath();
    let started = false;
    series.forEach((v, i) => {
      if(v === null) return;
      const x = padLeft + i * slot + slot / 2, y = yOf(v);
      if(!started){ ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  drawLine(sma(candles, 20), "#d4a13d");
  drawLine(sma(candles, 50), "#8b93a3");
}

// ---------- Lectura on-chain (JSON-RPC directo, sin librerías) ----------
async function rpcCall(rpcUrl, method, params){
  const res = await fetch(rpcUrl, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ jsonrpc: "2.0", id: 1, method, params })
  });
  if(!res.ok) throw new Error("RPC HTTP " + res.status);
  const json = await res.json();
  if(json.error) throw new Error(json.error.message || "RPC error");
  return json.result;
}
function hexToDecimal(hex, decimals){
  const bi = BigInt(hex);
  const s = bi.toString();
  if(decimals === 0) return Number(s);
  const padded = s.padStart(decimals + 1, "0");
  const intPart = padded.slice(0, -decimals) || "0";
  const fracPart = padded.slice(-decimals);
  return parseFloat(intPart + "." + fracPart);
}
async function getNativeBalance(rpcUrl, wallet){
  const hex = await rpcCall(rpcUrl, "eth_getBalance", [wallet, "latest"]);
  return hexToDecimal(hex, 18);
}
async function getTokenBalance(rpcUrl, tokenAddress, wallet, decimals){
  // balanceOf(address) selector 0x70a08231
  const data = "0x70a08231" + wallet.replace(/^0x/, "").padStart(64, "0");
  const hex = await rpcCall(rpcUrl, "eth_call", [{ to: tokenAddress, data }, "latest"]);
  return hexToDecimal(hex, decimals);
}

// === DV_HELPERS_START ===
// Fase 1 — modelo de estado del dato. Todo valor que dependa de una fuente externa
// (precio, balance derivado, etc.) se representa como { valor, estado, timestamp, fuente, mensaje }
// en vez de un número/string suelto. Objetivo: un fallo real (red caída, dato ausente) nunca debe
// poder confundirse con un valor legítimo de 0. Estados: OK, STALE, ERROR, APPROXIMATE, NOT_AVAILABLE.
const DV_ESTADOS = Object.freeze({
  OK: "OK", STALE: "STALE", ERROR: "ERROR", APPROXIMATE: "APPROXIMATE", NOT_AVAILABLE: "NOT_AVAILABLE"
});
function dvOk(valor, fuente, mensaje){
  return { valor, estado: DV_ESTADOS.OK, timestamp: Date.now(), fuente, mensaje: mensaje || null };
}
function dvApprox(valor, fuente, mensaje){
  return { valor, estado: DV_ESTADOS.APPROXIMATE, timestamp: Date.now(), fuente, mensaje: mensaje || null };
}
function dvError(fuente, mensaje){
  return { valor: null, estado: DV_ESTADOS.ERROR, timestamp: Date.now(), fuente, mensaje: mensaje || null };
}
function dvNotAvailable(fuente, mensaje){
  return { valor: null, estado: DV_ESTADOS.NOT_AVAILABLE, timestamp: Date.now(), fuente, mensaje: mensaje || null };
}
function dvIsUsable(dv){
  return !!dv && (dv.estado === DV_ESTADOS.OK || dv.estado === DV_ESTADOS.APPROXIMATE) && dv.valor != null;
}
// Extrae { usd } de la respuesta cruda de CoinGecko para un id, devolviendo un DataValue.
// pricesOk indica si la llamada a getPrices() completó sin lanzar excepción.
function dvFromCoingecko(pricesMap, id, pricesOk, pricesErrMsg){
  if(!pricesOk) return dvError("coingecko", pricesErrMsg || "Fallo de red al consultar CoinGecko");
  const entry = pricesMap ? pricesMap[id] : null;
  if(!entry || entry.usd == null) return dvNotAvailable("coingecko", `CoinGecko no devolvió precio para "${id}"`);
  return dvOk(entry.usd, "coingecko");
}
// Multiplica una cantidad numérica conocida (ej. balance on-chain) por un DataValue de precio.
// Si el precio no es usable, el resultado propaga el mismo estado en vez de fabricar un 0.
function dvMultiply(qty, priceDV, fuente){
  if(qty == null){
    return { valor: null, estado: DV_ESTADOS.NOT_AVAILABLE, timestamp: Date.now(), fuente, mensaje: "Cantidad base no disponible" };
  }
  if(!dvIsUsable(priceDV)){
    const estado = priceDV ? priceDV.estado : DV_ESTADOS.NOT_AVAILABLE;
    return { valor: null, estado, timestamp: Date.now(), fuente, mensaje: priceDV && priceDV.mensaje };
  }
  return { valor: qty * priceDV.valor, estado: priceDV.estado, timestamp: Date.now(), fuente, mensaje: priceDV.mensaje };
}
// Formatea un DataValue para texto (UI o resumen para IA). Nunca imprime un número falso.
function dvFmtUsd(dv, decimals){
  decimals = decimals == null ? 2 : decimals;
  if(!dvIsUsable(dv)) return dv && dv.estado === DV_ESTADOS.STALE ? "$?.?? (dato antiguo)" : "$?.?? (no disponible)";
  const prefix = dv.estado === DV_ESTADOS.APPROXIMATE ? "~$" : "$";
  return prefix + dv.valor.toFixed(decimals);
}
// Agrega el total en USD a partir del objeto state.balances. Pura (sin DOM, sin state global)
// para poder testearla igual que el resto del modelo de estado. Nunca devuelve un total "completo"
// que en realidad esconde datos ausentes: si ningún valor fue usable, usableCount queda en 0 y quien
// renderice debe tratarlo como "no disponible", no como "$0".
function aggregateBalancesTotal(balances){
  let total = 0, anyUnusable = false, usableCount = 0;
  for(const net of Object.values(balances || {})){
    if(!net.ok){ anyUnusable = true; continue; }
    if(dvIsUsable(net.nativeUsdDV)){ total += net.nativeUsdDV.valor; usableCount++; } else anyUnusable = true;
    (net.tokens || []).forEach(t => {
      if(dvIsUsable(t.usdDV)){ total += t.usdDV.valor; usableCount++; } else anyUnusable = true;
    });
  }
  return { total, anyUnusable, usableCount };
}

async function fetchKlines(symbol, interval, limit){
  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("Símbolo no encontrado en Binance o error HTTP " + res.status);
  const raw = await res.json();
  return raw.map(k => ({ t: k[0], o: +k[1], h: +k[2], l: +k[3], c: +k[4], v: +k[5] }));
}
async function fetchTickerPrice(symbol){
  const res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`);
  if(!res.ok) throw new Error("Símbolo no encontrado en Binance o error HTTP " + res.status);
  const json = await res.json();
  return parseFloat(json.price);
}
async function fetchPositionPrices(){
  const symbols = [...new Set(POSITIONS.flatMap(p => p.priceSymbols))];
  setState({ positionPricesLoading: true, positionPricesError: null });
  try{
    const entries = await Promise.all(symbols.map(async s => [s, await fetchTickerPrice(s)]));
    const prices = Object.fromEntries(entries);
    setState({ positionPrices: prices, positionPricesLoading: false, positionPricesAt: Date.now() });
  }catch(e){
    setState({ positionPricesLoading: false, positionPricesError: e.message });
  }
}
async function fetchPerformance(){
  setState({ performanceLoading: true, performanceError: null });
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/history.json?t=${Date.now()}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error("No se pudo leer history.json (HTTP " + res.status + ")");
    const json = await res.json();
    const perf = {};
    Object.entries(json.positions || {}).forEach(([tokenId, entries]) => {
      if(!entries || !entries.length) return;
      const latest = entries[entries.length - 1];
      // Serie de los últimos puntos con totalReturnPct, para un mini histórico si hace falta
      const series = entries.filter(e => typeof e.totalReturnPct === "number").map(e => ({ t: e.t, v: e.totalReturnPct }));
      perf[tokenId] = { ...latest, series };
    });
    setState({ performance: perf, performanceLoading: false, performanceAt: Date.now() });
  }catch(e){
    setState({ performanceLoading: false, performanceError: e.message });
  }
}
function computePositionLive(p){
  const prices = state.positionPrices;
  let livePrice = null;
  if(p.priceMode === "direct"){
    livePrice = prices[p.priceSymbols[0]] ?? null;
  } else if(p.priceMode === "ratio"){
    const eth = prices[p.priceSymbols[0]], alt = prices[p.priceSymbols[1]];
    if(eth != null && alt != null && alt !== 0) livePrice = eth / alt;
  }
  if(livePrice == null) return null;
  const inRange = livePrice >= p.rangeMin && livePrice <= p.rangeMax;
  const marginLowPct = ((livePrice - p.rangeMin) / livePrice) * 100;
  const marginHighPct = ((p.rangeMax - livePrice) / livePrice) * 100;
  return { livePrice, inRange, marginLowPct, marginHighPct };
}
function sma(candles, period){
  const out = new Array(candles.length).fill(null);
  for(let i = period - 1; i < candles.length; i++){
    let sum = 0;
    for(let j = i - period + 1; j <= i; j++) sum += candles[j].c;
    out[i] = sum / period;
  }
  return out;
}
function rsi(candles, period){
  if(candles.length < period + 1) return null;
  let gains = 0, losses = 0;
  for(let i = candles.length - period; i < candles.length; i++){
    const diff = candles[i].c - candles[i - 1].c;
    if(diff >= 0) gains += diff; else losses -= diff;
  }
  const avgGain = gains / period, avgLoss = losses / period;
  if(avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - (100 / (1 + rs));
}
function toNum(v){
  if(v === null || v === undefined || v === "") return NaN;
  return parseFloat(String(v).replace(",", "."));
}
function formatPrice(p){
  if(p >= 100) return p.toFixed(2);
  if(p >= 1) return p.toFixed(4);
  return p.toFixed(6);
}

// Binance, y calcula sus indicadores. Así el Asistente no depende de que una búsqueda web
// encuentre por su cuenta el RSI de 1h o de 15m — lo tiene garantizado y sincronizado con
// el mismo dato que usa el resto del panel.
const MTF_INTERVALS = ["15m", "1h", "4h", "1d"];
async function loadMultiTimeframeSnapshot(symbol){
  const timeframes = {};
  await Promise.all(MTF_INTERVALS.map(async interval => {
    try{
      const candles = await fetchKlines(symbol, interval, 60);
      if(!candles || candles.length < 15) { timeframes[interval] = null; return; }
      const last = candles[candles.length - 1];
      const first = candles[0];
      timeframes[interval] = {
        price: last.c,
        changePct: ((last.c - first.o) / first.o) * 100,
        rsi: rsi(candles, 14),
        sma20: candles.length >= 20 ? sma(candles, 20).slice(-1)[0] : null,
        sma50: candles.length >= 50 ? sma(candles, 50).slice(-1)[0] : null
      };
    }catch(e){ timeframes[interval] = null; }
  }));
  state.mtfSnapshots = { ...state.mtfSnapshots, [symbol]: { at: Date.now(), timeframes } };
}

function drawChart(){
  const canvas = document.getElementById("trading-canvas");
  if(!canvas) return;
  const candles = state.trading.candles;
  if(!candles || candles.length === 0) return;

  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 600;
  const cssHeight = 320;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const priceH = cssHeight * 0.75, volH = cssHeight * 0.2, gap = cssHeight * 0.05;
  const padLeft = 6, padRight = 56;
  const plotW = cssWidth - padLeft - padRight;
  const n = candles.length;
  const slot = plotW / n;
  const candleW = Math.max(1.5, slot * 0.6);

  const sma20 = sma(candles, 20), sma50 = sma(candles, 50);
  let min = Infinity, max = -Infinity;
  candles.forEach(c => { if(c.l < min) min = c.l; if(c.h > max) max = c.h; });
  const pricePad = (max - min) * 0.08 || max * 0.01;
  min -= pricePad; max += pricePad;
  const yPrice = v => priceH - ((v - min) / (max - min)) * priceH;

  let maxVol = 0;
  candles.forEach(c => { if(c.v > maxVol) maxVol = c.v; });
  const yVol = v => volH - (v / (maxVol || 1)) * volH;

  // grid + price labels
  ctx.strokeStyle = "#2a2f3a"; ctx.lineWidth = 1; ctx.font = "10px IBM Plex Mono"; ctx.fillStyle = "#5f6675";
  for(let i = 0; i <= 4; i++){
    const y = (priceH / 4) * i;
    ctx.beginPath(); ctx.moveTo(padLeft, y); ctx.lineTo(padLeft + plotW, y); ctx.stroke();
    const val = max - ((max - min) / 4) * i;
    ctx.fillText(formatPrice(val), padLeft + plotW + 6, y + 3);
  }

  // candles
  candles.forEach((c, i) => {
    const x = padLeft + i * slot + slot / 2;
    const up = c.c >= c.o;
    ctx.strokeStyle = ctx.fillStyle = up ? "#4fb0a8" : "#e2685a";
    ctx.beginPath(); ctx.moveTo(x, yPrice(c.h)); ctx.lineTo(x, yPrice(c.l)); ctx.stroke();
    const bodyTop = yPrice(Math.max(c.o, c.c)), bodyBot = yPrice(Math.min(c.o, c.c));
    ctx.fillRect(x - candleW / 2, bodyTop, candleW, Math.max(1, bodyBot - bodyTop));
  });

  // SMA lines
  function drawSma(series, color){
    ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
    let started = false;
    series.forEach((v, i) => {
      if(v === null) return;
      const x = padLeft + i * slot + slot / 2, y = yPrice(v);
      if(!started){ ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
    });
    ctx.stroke();
  }
  drawSma(sma20, "#d4a13d");
  drawSma(sma50, "#8b93a3");

  // volume
  const volTop = priceH + gap;
  candles.forEach((c, i) => {
    const x = padLeft + i * slot + slot / 2;
    const up = c.c >= c.o;
    ctx.fillStyle = up ? "rgba(79,176,168,.5)" : "rgba(226,104,90,.5)";
    const h = volH - yVol(c.v);
    ctx.fillRect(x - candleW / 2, volTop + yVol(c.v), candleW, h);
  });
}

      "\n\nREGLA SOBRE PEDIR HIPÓTESIS: Valentín no tiene criterio propio para formarse una opinión sobre hacia dónde va un precio — no le está pidiendo tu opinión, le está pidiendo ayuda para poder tener una. Por eso, si en algún momento tu respuesta iba a terminar preguntándole 'cuál es tu hipótesis' o 'qué esperas que haga el precio' sin darle antes con qué construirla, para y constrúyela tú primero: da el caso técnico a favor de que el movimiento continúe, el caso técnico a favor de que corrija, busca en la web los catalizadores fundamentales detrás del movimiento reciente, y termina señalando qué haría falta ver para confirmar cada escenario. Solo entonces, si aún quieres preguntarle algo, pregúntale cuál de los dos casos le resulta más convincente — no le pidas una hipótesis a partir de la nada." +
      "\n\nREGLA DE FORMATO OBLIGATORIA: Valentín no tiene formación financiera y le cuesta interpretar respuestas muy estructuradas en tablas, subtítulos técnicos y bloques de riesgo genéricos. NUNCA uses tablas markdown, ni más de un nivel de encabezados, ni emojis decorativos como separadores de sección. En vez de eso, organiza SIEMPRE la respuesta como una serie corta de preguntas de decisión concretas que él se estaría haciendo, cada una resuelta en pocas frases, en lenguaje llano (evita jerga sin explicarla la primera vez, ej. 'impermanent loss' → explica qué significa en una frase la primera vez que aparezca). Si hay varias alternativas o caminos posibles, preséntalos como una lista breve con la recomendación explícita y el porqué, no como una tabla comparativa. Termina, si aplica, con UNA pregunta concreta que le ayude a decidir el siguiente paso — no una lista larga de riesgos sueltos al final." +
      "\n\nREGLA SOBRE TRADING ESPECULATIVO (NATGAS u otros instrumentos apalancados): el contexto incluye, si están disponibles, indicadores técnicos (RSI, MACD, Bollinger) y las alertas activas configuradas (con su dirección, disparador, SL y TP). Esas alertas reflejan una decisión tomada en el pasado, no una limitación de lo que es posible ahora — si Valentín te pregunta por la mejor forma de entrar, evalúa libremente tanto largo como corto según lo que indiquen los datos actuales, sin asumir que la única opción válida es la dirección de la alerta ya configurada. Puede tener varias alertas activas del mismo instrumento a la vez (ej. una COMPRAR y otra CORTO) sin coste extra de API, así que si ves sentido en cubrir ambos escenarios, puedes proponer añadir una alerta nueva en vez de sustituir la existente — solo ten cuidado si el instrumento es distinto (otro priceCode), ahí sí hay poco margen en la cuota gratis mensual." +
      "\n\nREGLA OBLIGATORIA: Valentín es nuevo en inversión y decide con capital real. En CUALQUIER recomendación o análisis de una oportunidad de inversión (comprar, vender, entrar en una posición, un token, un activo, etc.), estructura siempre la respuesta con: (1) la tesis a favor, (2) los riesgos y el caso en contra, explícitos y concretos, (3) nunca una instrucción directa de tipo 'haz X' sin ese contraste. No eres asesor financiero — sé claro con eso si la pregunta lo requiere. Responde de forma directa y técnica pero en lenguaje llano, sin relleno, y cuestiona sus planteamientos si ves una alternativa mejor.";
    // El historial completo del chat se manda siempre — así el Asistente recuerda lo que
    // se habló en turnos anteriores (planes propuestos, decisiones, etc.) en vez de perder
    // el hilo cada vez. El contexto vivo del panel (balances, posiciones, indicadores) va
    // como "system", separado, para no repetirlo en cada turno del historial.
    const historyMessages = priorMessages.map(m => ({ role: m.role, content: m.content }));
    const userContent = attachedImage
      ? [
          { type: "image", source: { type: "base64", media_type: attachedImage.mediaType, data: attachedImage.data } },
          { type: "text", text: text }
        ]
      : text;
    const apiMessages = [...historyMessages, { role: "user", content: userContent }];
    const headers = { "Content-Type": "application/json" };
    if(!IN_ARTIFACT){
      headers["x-api-key"] = state.apiKeyPlain;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    }
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers,
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 4096,
        system: systemContext,
        messages: apiMessages,
        tools: [{ type: "web_search_20250305", name: "web_search" }]
      })
    });
    const data = await response.json();
    if(data.error){ throw new Error(data.error.message || "Error de la API"); }
    const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text);
    let replyText = textBlocks.join("\n") || "(sin respuesta)";
    const searchCount = (data.content || []).filter(b => b.type === "server_tool_use" && b.name === "web_search").length;
    const u = data.usage || {};
    const newUsage = {
      inputTokens: state.usage.inputTokens + (u.input_tokens || 0),
      outputTokens: state.usage.outputTokens + (u.output_tokens || 0),
      searches: state.usage.searches + searchCount
    };
    await storeSet("usage-stats", newUsage);

    let autoSaved = false;
    let newHistory = state.history;
    const blockMatch = replyText.match(/===HISTORICO_GUARDABLE===([\s\S]*?)===FIN_HISTORICO===/);
    if(blockMatch){
      const savableContent = blockMatch[1].trim();
      replyText = replyText.replace(blockMatch[0], "").trim();
      if(savableContent){
        const entry = { id: Date.now() + "-auto", asset: state.researchAsset, savedAt: new Date().toISOString(), content: savableContent, auto: true };
        newHistory = [...state.history, entry];
        await storeSet("historical-events", newHistory);
        autoSaved = true;
      }
    }

    const finalMessages = [...newMessages, { role: "assistant", content: replyText, saved: autoSaved, savedAsset: autoSaved ? state.researchAsset : undefined, autoSaved }];
    setState({ chatMessages: finalMessages, chatLoading: false, usage: newUsage, history: newHistory });
    await storeSet("chat-history", finalMessages);
  }catch(e){
    const finalMessages = [...newMessages, { role: "assistant", content: "Error al contactar con la API: " + e.message }];
    setState({ chatMessages: finalMessages, chatLoading: false });
  }
}

function buildContextSummary(){
  let s = "";
  if(state.balances){
    for(const [key, net] of Object.entries(state.balances)){
      if(net.ok){
        s += `- ${NETWORKS[key].label}: ${net.native.toFixed(5)} ${net.nativeSymbol} (${dvFmtUsd(net.nativeUsdDV)})`;
        net.tokens.forEach(t => { s += `, ${t.balance !== null ? t.balance.toFixed(3) : "?"} ${t.symbol} (${dvFmtUsd(t.usdDV)})`; });
        s += "\n";
      } else {
        s += `- ${NETWORKS[key].label}: ERROR al leer balances (${net.error}) — dato no disponible, no asumir $0\n`;
      }
    }
  } else {
    s += "(balances no cargados todavía)\n";
  }
  s += "\nPosiciones LP activas:\n";
  POSITIONS.forEach(p => {
    s += `- ${p.pair} en ${p.network}, NFT #${p.id}, fee ${p.fee}, rango ${p.range}, depósito inicial ${p.deposit}`;
    const live = computePositionLive(p);
    if(live){
      s += ` — precio en vivo: ${formatPrice(live.livePrice)} (${live.inRange ? "dentro de rango" : "FUERA DE RANGO"}, margen ${live.marginLowPct.toFixed(2)}% hasta mínimo / ${live.marginHighPct.toFixed(2)}% hasta máximo)`;
    } else {
      s += ` — precio en vivo no disponible todavía`;
    }
    const perf = state.performance[p.id];
    if(perf && perf.totalReturnPct != null){
      s += ` — rendimiento total: ${perf.totalReturnPct >= 0 ? "+" : ""}${perf.totalReturnPct.toFixed(2)}% (valor $${perf.positionValueUSD?.toFixed(2)}, fees $${perf.feesValueUSD?.toFixed(2)}, dato del bot de ${perf.t ? new Date(perf.t).toLocaleString("es-ES") : "?"})`;
    }
    s += "\n";
  });
  if(state.positionPricesAt) s += `(precios de posiciones actualizados ${new Date(state.positionPricesAt).toLocaleString("es-ES")})\n`;
  if(state.trading.candles && state.trading.candles.length){
    const t = state.trading;
    const last = t.candles[t.candles.length - 1];
    const first = t.candles[0];
    const changePct = ((last.c - first.o) / first.o) * 100;
    const rsiVal = rsi(t.candles, 14);
    const sma20v = sma(t.candles, 20).slice(-1)[0];
    const sma50v = sma(t.candles, 50).slice(-1)[0];
    s += `\nGráfico cargado ahora mismo en pantalla — ${t.symbol}, velas de ${t.interval} (últimas ${t.candles.length}):\n`;
    s += `- Precio actual: ${formatPrice(last.c)}\n`;
    s += `- Variación en la ventana cargada: ${changePct.toFixed(2)}%\n`;
    s += `- RSI(14) en ESTE intervalo (${t.interval}) únicamente: ${rsiVal !== null ? rsiVal.toFixed(1) : "no disponible"}\n`;
    s += `- SMA20: ${sma20v ? formatPrice(sma20v) : "no disponible"}, SMA50: ${sma50v ? formatPrice(sma50v) : "no disponible"}\n`;
  }
  Object.entries(state.mtfSnapshots).forEach(([symbol, snap]) => {
    const ageMin = (Date.now() - snap.at) / 60000;
    s += `\nIndicadores multi-plazo de ${symbol} (pedidos directamente a Binance hace ${ageMin < 1 ? "menos de 1 min" : Math.round(ageMin) + " min"}, no de búsqueda web — usa estos números, no inventes ni busques otros para estos plazos):\n`;
    Object.entries(snap.timeframes).forEach(([interval, d]) => {
      if(!d){ s += `- ${interval}: no disponible\n`; return; }
      s += `- ${interval}: precio ${formatPrice(d.price)}, variación ventana ${d.changePct.toFixed(2)}%, RSI(14) ${d.rsi !== null ? d.rsi.toFixed(1) : "—"}, SMA20 ${d.sma20 ? formatPrice(d.sma20) : "—"}, SMA50 ${d.sma50 ? formatPrice(d.sma50) : "—"}\n`;
    });
  });
  Object.values(state.instruments).forEach(instr => {
    if(instr.livePrice === null && instr.trades.length === 0 && instr.alerts.length === 0) return;
    s += `\n${instr.label} — trading especulativo apalancado (presupuesto ${instr.budget}$):\n`;
    if(instr.livePrice !== null) s += `- Precio en vivo: $${instr.livePrice.toFixed(3)} (actualizado ${instr.livePriceAt ? new Date(instr.livePriceAt).toLocaleString("es-ES") : "?"})\n`;
    if(instr.candles && instr.candles.length >= 20){
      const rsiVal = rsi(instr.candles, 14);
      const macdRes = macd(instr.candles);
      const macdHist = macdRes && macdRes.histogram ? macdRes.histogram[macdRes.histogram.length - 1] : null;
      const boll = bollinger(instr.candles, 20, 2);
      const bollUpper = boll && boll.upper ? boll.upper[boll.upper.length - 1] : null;
      const bollLower = boll && boll.lower ? boll.lower[boll.lower.length - 1] : null;
      s += `- Indicadores (proxy ${instr.proxySymbol || "?"}): RSI(14) ${rsiVal !== null ? rsiVal.toFixed(1) : "no disponible"}, MACD histograma ${macdHist !== null ? macdHist.toFixed(3) : "no disponible"}, Bollinger(20,2) ${bollLower !== null ? bollLower.toFixed(2) : "?"}–${bollUpper !== null ? bollUpper.toFixed(2) : "?"}\n`;
    }
    if(instr.alerts && instr.alerts.length){
      s += `- Alertas activas:\n`;
      instr.alerts.forEach(a => {
        s += `  · ${a.direction} — disparador ${a.triggerPrice}, SL ${a.precioSL}, TP ${a.precioTP}, apalancamiento ${a.apalancamiento}x${a.invertido ? `, importe $${a.invertido}` : ""}${a.nota ? `, nota: "${a.nota}"` : ""}\n`;
      });
    }
    const openTrades = instr.trades.filter(t => !t.cerrado);
    if(openTrades.length){
      s += `- Operaciones abiertas:\n`;
      openTrades.forEach(t => {
        const floating = calcFloatingPnl(t, instr.livePrice);
        s += `  · ${t.direccion} $${t.invertido} a ${t.apalancamiento}x, entrada ${t.precioEntrada}, SL ${t.precioSL}, TP ${t.precioTP}${floating !== null ? `, P&L flotante: ${floating>=0?'+':''}$${floating.toFixed(2)}` : ""}${t.nota ? `, nota: "${t.nota}"` : ""}\n`;
      });
    }
  });
  const symbolTag = state.researchAsset;
  const relevantHistory = state.history.filter(h => h.asset === symbolTag).slice(-3);
  if(relevantHistory.length){
    s += `\nInvestigación ya guardada para "${symbolTag}" (usa esto antes de volver a buscar lo mismo):\n`;
    relevantHistory.forEach(h => { s += `- [guardado ${new Date(h.savedAt).toLocaleDateString("es-ES")}] ${h.content.slice(0, 400)}\n`; });
  }
  if(state.portfolio){
    const p = state.portfolio;
    s += `\nAsignación de cartera propuesta por Valentín (total ${p.total}€): renta variable ${p.allocations.renta_variable}%, renta fija ${p.allocations.renta_fija}%, commodities/oro ${p.allocations.commodities}%, cripto ${p.allocations.cripto}%, efectivo ${p.allocations.efectivo}%.\n`;
  }
  return s;
}

function tabBtn(key, label){

}

function renderBalances(){
  if(!state.wallet){
    return `<div class="card"><p class="muted">No hay wallet configurada. Ve a <b>Ajustes</b> e introduce tu dirección pública (0x...).</p></div>`;
  }
  let body = "";
  if(state.balancesLoading) body = `<div class="card"><span class="loader"></span> <span class="muted">Leyendo balances on-chain...</span></div>`;
  else if(state.balancesError) body = `<div class="card"><p class="err">${state.balancesError}</p></div>`;
  else if(state.balances){
    body = Object.entries(state.balances).map(([key, net]) => {
      if(!net.ok) return `<div class="card"><h2>${NETWORKS[key].label}</h2><p class="err">Error: ${net.error}</p></div>`;
      const rows = [`<div class="row"><span class="l">${net.nativeSymbol} (nativo)</span><span class="r">${net.native.toFixed(5)} <small>${dvFmtUsd(net.nativeUsdDV)}</small></span></div>`]
        .concat(net.tokens.map(t => `<div class="row"><span class="l">${t.symbol}</span><span class="r">${t.error ? "error" : t.balance.toFixed(3)} <small>${dvFmtUsd(t.usdDV)}</small></span></div>`));
      return `<div class="card"><h2>${NETWORKS[key].label}</h2>${rows.join("")}</div>`;
    }).join("");
    const { total, anyUnusable, usableCount } = aggregateBalancesTotal(state.balances);
    // Si NINGÚN valor pudo sumarse, "$0.00" sería el mismo bug que estamos corrigiendo
    // (un cero que parece un dato real). En ese caso concreto, no mostramos ninguna cifra.
    const totalLabel = anyUnusable ? " (parcial)" : "";
    const totalValueHtml = usableCount === 0
      ? `$?.?? <small class="err">no disponible — ningún dato pudo leerse</small>`
      : `$${total.toFixed(2)}${anyUnusable ? " <small class=\"err\">+ valores no disponibles, no incluidos</small>" : ""}`;
    body += `<div class="card"><div class="row"><span class="l" style="font-weight:600;color:var(--text)">Total estimado${totalLabel}</span><span class="r" style="color:var(--gold);font-size:15px">${totalValueHtml}</span></div></div>`;
  } else {
    body = `<div class="card"><p class="muted">Pulsa "Actualizar" para leer los balances.</p></div>`;
  }
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span class="muted mono">${shortAddr(state.wallet)}</span>
      <button class="btn-ghost btn-sm" id="btn-refresh-balances">Actualizar</button>
    </div>
    ${body}
  `;
}

function renderPortfolioPlan(){
  const plan = state.portfolioPlan;
  const schedule = buildContributionSchedule();
  const fmtE = (v) => v == null ? "—" : v.toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "€";

  const scheduleRows = schedule.map(m => {
    const totalPlanned = m.targets.reduce((a, t) => a + t.planned, 0);
    const totalActual = Object.values(m.actualByKey).reduce((a, v) => a + v, 0);
    const complete = totalActual >= totalPlanned - 0.01;
    return `
      <tr>
        <td class="name-cell">${m.monthLabel} <span class="num">${m.kind}</span></td>
        ${m.targets.map(t => {
          const actual = m.actualByKey[t.key];
          const ok = actual >= t.planned - 0.01;
          const partial = actual > 0 && !ok;
          return `<td style="color:${ok ? 'var(--teal)' : partial ? 'var(--gold)' : 'var(--muted)'}">${fmtE(actual)} <span class="muted" style="font-size:10px">/ ${fmtE(t.planned)}</span></td>`;
        }).join("")}
        <td style="font-weight:600;color:${complete ? 'var(--teal)' : 'var(--coral)'}">${complete ? "✅" : "⏳"} ${fmtE(totalActual)} / ${fmtE(totalPlanned)}</td>
      </tr>`;
  }).join("");

  const config = `
    <div class="card">
      <h2>Calendario de aportaciones</h2>
      <p class="muted" style="margin-top:0">Se genera solo a partir de la asignación objetivo de arriba — no marcas nada a mano, se compara automáticamente con lo que registres como comprado abajo.</p>
      <div class="grid2" style="margin-bottom:8px">
        <div><label>Aportación inicial (€)</label><input type="text" id="plan-initial" value="${escapeAttr(String(plan.initialAmount))}" /></div>
        <div><label>Aportación mensual (€)</label><input type="text" id="plan-monthly" value="${escapeAttr(String(plan.monthlyAmount))}" /></div>
        <div><label>Fecha de inicio</label><input type="date" id="plan-startdate" value="${escapeAttr(plan.startDate)}" /></div>
        <div><label>Meses a planificar</label><input type="text" id="plan-months" value="${escapeAttr(String(plan.monthsAhead))}" /></div>
      </div>
      <div class="pos-table-wrap">
        <table class="pos-table">
          <thead><tr>
            <th>Mes</th>${ASSET_CLASSES.map(c => `<th>${c.label.split(" ")[0]}</th>`).join("")}<th>Total</th>
          </tr></thead>
          <tbody>${scheduleRows}</tbody>
        </table>
      </div>
      <p class="muted" style="font-size:11px;margin-top:8px">Verde = objetivo del mes cubierto. Ámbar = parcialmente cubierto. Gris = nada registrado todavía ese mes en esa clase.</p>
    </div>`;

  const holdings = state.portfolioHoldings.map((h, idx) => {
    const current = holdingCurrentValueEUR(h);
    const gain = current != null ? current - h.investedEUR : null;
    const gainPct = (gain != null && h.investedEUR > 0) ? (gain / h.investedEUR) * 100 : null;
    return { ...h, idx, current, gain, gainPct };
  });
  const totalInvested = holdings.reduce((a, h) => a + (Number(h.investedEUR) || 0), 0);
  const totalAgg = aggregateHoldingsCurrentValue(holdings);
  const totalCurrent = totalAgg.sum;

  const holdingRows = holdings.map(h => `
    <tr>
      <td class="name-cell">${escapeHtml(h.product || "—")} <span class="num">${ASSET_CLASSES.find(c => c.key === h.assetKey)?.label.split(" ")[0] || h.assetKey}</span></td>
      <td>${new Date(h.date).toLocaleDateString("es-ES")}</td>
      <td>${fmtE(Number(h.investedEUR))}</td>
      <td>${h.valuationMode === "manual" ? "manual" : h.valuationMode === "gold" ? "oro (auto)" : "cripto (auto)"}</td>
      <td>${h.current != null ? fmtE(h.current) : "—"}</td>
      <td style="color:${h.gain == null ? 'inherit' : h.gain >= 0 ? 'var(--teal)' : 'var(--coral)'}">${h.gainPct != null ? (h.gainPct >= 0 ? "+" : "") + h.gainPct.toFixed(2) + "%" : "—"}</td>
      <td><button class="btn-ghost btn-sm btn-delete-holding" data-idx="${h.idx}" style="color:var(--coral)">Eliminar</button></td>
    </tr>`).join("");

  // Desviación: peso real de cada clase (según valor actual conocido) vs el objetivo guardado.
  const deviationRows = ASSET_CLASSES.map(c => {
    const classHoldings = holdings.filter(h => h.assetKey === c.key);
    const classInvested = classHoldings.reduce((a, h) => a + (Number(h.investedEUR) || 0), 0);
    const classAgg = aggregateHoldingsCurrentValue(classHoldings);
    const classCurrent = classAgg.sum;
    const targetPct = Number(state.portfolio.allocations[c.key]) || 0;
    const actualPct = (totalCurrent != null && totalCurrent > 0 && classCurrent != null) ? (classCurrent / totalCurrent) * 100 : null;
    const diff = actualPct != null ? actualPct - targetPct : null;
    // Parcial si esta clase o el total general se calcularon con datos incompletos —
    // en cualquiera de los dos casos, el % mostrado no es del todo fiable.
    const isPartial = classAgg.isPartial || totalAgg.isPartial;
    return { label: c.label, targetPct, actualPct, classInvested, classCurrent, diff, isPartial };
  });

  const newForm = state.newHoldingForm;
  const addForm = `
    <div class="card">
      <h2>Registro de compras reales</h2>
      <p class="muted" style="margin-top:0">Cada compra que hagas en tu bróker, anótala aquí. Oro y cripto se revalorizan solos con precio en vivo; fondos indexados y bonos los actualizas tú a mano cuando quieras.</p>
      ${!state.showAddHolding ? `
        <button class="btn-gold btn-sm" id="btn-toggle-add-holding">+ Registrar compra</button>
      ` : `
        <div class="grid2" style="margin-top:8px">
          <div><label>Clase de activo</label>
            <select id="nh-assetkey">${ASSET_CLASSES.map(c => `<option value="${c.key}" ${newForm.assetKey === c.key ? "selected" : ""}>${c.label}</option>`).join("")}</select>
          </div>
          <div><label>Producto (ej. MSCI World, BTC, Xtrackers Gold)</label><input type="text" id="nh-product" value="${escapeAttr(newForm.product)}" placeholder="MSCI World - MyInvestor" /></div>
          <div><label>Fecha de compra</label><input type="date" id="nh-date" value="${escapeAttr(newForm.date)}" /></div>
          <div><label>Importe invertido (€)</label><input type="text" id="nh-investedeur" value="${escapeAttr(newForm.investedEUR)}" placeholder="150" /></div>
          <div><label>Valoración</label>
            <select id="nh-valuationmode">
              <option value="manual" ${newForm.valuationMode === "manual" ? "selected" : ""}>Manual (fondos, bonos, sin API pública)</option>
              <option value="gold" ${newForm.valuationMode === "gold" ? "selected" : ""}>Automática — oro (usa el precio del instrumento ORO)</option>
              <option value="binance" ${newForm.valuationMode === "binance" ? "selected" : ""}>Automática — cripto (Binance)</option>
            </select>
          </div>
          ${newForm.valuationMode !== "manual" ? `
            <div><label>${newForm.valuationMode === "binance" ? "Símbolo Binance (ej. BTCUSDT)" : "Onzas de oro compradas"}</label><input type="text" id="nh-symbolunits" value="${escapeAttr(newForm.valuationMode === "binance" ? newForm.symbol : newForm.units)}" placeholder="${newForm.valuationMode === "binance" ? "BTCUSDT" : "0.15"}" /></div>
            ${newForm.valuationMode === "binance" ? `<div><label>Unidades compradas</label><input type="text" id="nh-units" value="${escapeAttr(newForm.units)}" placeholder="0.001" /></div>` : ""}
          ` : `
            <div><label>Valor actual (€) — déjalo igual al importe si acabas de comprarlo</label><input type="text" id="nh-manualvalue" value="${escapeAttr(newForm.manualCurrentValueEUR)}" placeholder="150" /></div>
          `}
        </div>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-gold btn-sm" id="btn-add-holding">Registrar</button>
          <button class="btn-ghost btn-sm" id="btn-cancel-add-holding">Cancelar</button>
        </div>
      `}
      ${holdings.length ? `
      <div class="pos-table-wrap" style="margin-top:12px">
        <table class="pos-table">
          <thead><tr><th>Producto</th><th>Fecha</th><th>Invertido</th><th>Valoración</th><th>Valor actual</th><th>Rendim.</th><th></th></tr></thead>
          <tbody>${holdingRows}</tbody>
        </table>
      </div>
      <p class="muted" style="font-size:11px;margin-top:6px">Total invertido: ${fmtE(totalInvested)} · Valor actual conocido: ${totalCurrent != null ? fmtE(totalCurrent) + (totalAgg.isPartial ? ` <span style="color:var(--coral)">(parcial — ${totalAgg.known}/${totalAgg.total} holdings con precio)</span>` : "") : "incompleto (hay holdings manuales sin actualizar)"}</p>
      ` : `<p class="muted" style="margin-top:12px">Todavía no hay compras registradas.</p>`}
    </div>`;

  const anyPartial = deviationRows.some(d => d.isPartial && d.actualPct != null);
  const deviation = `
    <div class="card">
      <h2>¿Sigo el reparto objetivo?</h2>
      <p class="muted" style="margin-top:0">Peso real de cada clase (según valor actual conocido) frente al objetivo guardado en la calculadora de arriba.</p>
      ${deviationRows.map(d => `
        <div class="row">
          <span class="l">${d.label}</span>
          <span class="r">${d.actualPct != null ? (d.isPartial ? "~" : "") + d.actualPct.toFixed(1) + "%" : "—"} <span class="muted">/ obj. ${d.targetPct}%</span>${d.diff != null ? ` <span style="color:${Math.abs(d.diff) > 5 ? 'var(--coral)' : 'var(--muted)'}">(${d.diff >= 0 ? "+" : ""}${d.diff.toFixed(1)}pp)</span>` : ""}</span>
        </div>`).join("")}
      ${anyPartial ? `<p class="muted" style="font-size:11px;margin-top:6px;color:var(--coral)">~ = calculado con datos parciales (algún holding sin precio en vivo todavía) — el % real puede diferir.</p>` : ""}
      <p class="muted" style="font-size:11px;margin-top:8px">Desviaciones de más de ±5 puntos porcentuales suelen ser la señal habitual para plantearse rebalancear. No es una regla automática, solo una referencia.</p>
    </div>`;

  return config + addForm + deviation;
}

function drawPortfolioChart(){
  const canvas = document.getElementById("portfolio-canvas");
  if(!canvas) return;
  const p = state.portfolio;
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = canvas.clientWidth || 600, cssHeight = 140;
  canvas.width = cssWidth * dpr; canvas.height = cssHeight * dpr;
  canvas.style.height = cssHeight + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, cssWidth, cssHeight);

  const barH = 26, gapY = 10;
  ASSET_CLASSES.forEach((c, i) => {
    const y = i * (barH + gapY);
    const pct = Number(p.allocations[c.key]) || 0;
    const w = (cssWidth - 90) * (pct / 100);
    ctx.fillStyle = "#20242e";
    ctx.fillRect(80, y, cssWidth - 90, barH);
    ctx.fillStyle = c.color;
    ctx.fillRect(80, y, w, barH);
    ctx.fillStyle = "#8b93a3"; ctx.font = "11px IBM Plex Mono"; ctx.textAlign = "right";
    ctx.fillText(c.label.split(" ")[0], 74, y + barH / 2 + 4);
    ctx.fillStyle = "#eef1f5"; ctx.textAlign = "left";
    ctx.fillText(pct + "% · " + Math.round(p.total * pct / 100) + "€", 86, y + barH / 2 + 4);
  });
}

async function syncGeoFromGithub(){
  setState({ geoSyncLoading: true, geoSyncStatus: "" });
  try{
    const url = `https://raw.githubusercontent.com/${GITHUB_REPO}/main/geo-log.json`;
    const res = await fetch(url + `?t=${Date.now()}`); // evita caché
    if(!res.ok) throw new Error(`No se pudo leer geo-log.json (HTTP ${res.status}). ¿Existe ya en el repo y es público?`);
    const json = await res.json();
    const existingIds = new Set(state.history.map(h => h.id));
    let added = 0;
    const newEntries = [];
    Object.entries(json.entries || {}).forEach(([instrument, entries]) => {
      entries.forEach(e => {
        if(!existingIds.has(e.id)){
          newEntries.push({ id: e.id, asset: instrument, savedAt: e.savedAt, content: e.content, auto: true });
          added++;
        }
      });
    });
    const merged = [...state.history, ...newEntries];
    setState({ history: merged, geoSyncLoading: false, geoSyncStatus: added > 0 ? `${added} entrada(s) nueva(s) importada(s).` : "Ya estaba todo al día, nada nuevo que importar." });
    await storeSet("historical-events", merged);
  }catch(e){
    setState({ geoSyncLoading: false, geoSyncStatus: "Error: " + e.message });
  }
}

async function calibrateInstrument(key){
  const instr = getInstrument(key);
  const etoroPrice = toNum(state.calibrationEtoroPrice);
  if(!etoroPrice){ alert("Mete el precio actual en eToro antes de calibrar."); return; }
  if(!instr.candles || instr.candles.length === 0){ alert("Carga primero el gráfico de velas para tener el precio del proxy."); return; }
  const proxyPrice = instr.candles[instr.candles.length - 1].c;
  const ratio = etoroPrice / proxyPrice;
  const calibration = { etoroPrice, proxyPrice, ratio, calibratedAt: new Date().toISOString() };
  setInstrument(key, { calibration });
  await storeSet("instruments-catalog", state.instruments);
  state.calibrationEtoroPrice = "";
  await syncCalibrationToGithub();
  render();
}

function buildCalibrationsPayload(){
  const calibrations = [];
  Object.values(state.instruments).forEach(instr => {
    if(instr.calibration && instr.proxySymbol){
      calibrations.push({
        instrument: instr.label, proxySymbol: instr.proxySymbol,
        ratio: instr.calibration.ratio, calibratedAt: instr.calibration.calibratedAt,
        maxDaysBeforeReminder: 14
      });
    }
  });
  return { calibrations };
}
async function syncCalibrationToGithub(){
  if(!state.githubTokenPlain){
    setState({ githubSyncStatus: "Calibración guardada solo en local — desbloquea el token de GitHub en Ajustes para sincronizar automáticamente, o usa 'Copiar JSON' + pegar manual." });
    return;
  }
  try{
    await githubPutFile("calibration.json", buildCalibrationsPayload(), `Update calibration.json (auto, ${new Date().toISOString()})`);
    setState({ githubSyncStatus: "Calibración guardada y sincronizada con GitHub." });
  }catch(e){
    setState({ githubSyncStatus: "Calibración guardada en local, pero falló la sincronización con GitHub: " + e.message });
  }
}

}

function instrumentStats(n){
  const closed = n.trades.filter(t => t.resultado !== null && t.resultado !== undefined);
  const realizedPL = closed.reduce((sum, t) => sum + Number(t.resultado || 0), 0);
  const openRisk = n.trades.filter(t => !t.cerrado).reduce((sum, t) => sum + Number(t.maxPerdida || 0), 0);
  const used = n.trades.reduce((sum, t) => sum + (t.cerrado ? 0 : Number(t.invertido || 0)), 0);
  const remaining = n.budget + realizedPL - used;
  return { realizedPL, openRisk, used, remaining };
}

function calcFloatingPnl(t, livePrice){
  if(livePrice === null || livePrice === undefined) return null;
  const dirSign = t.direccion === "COMPRAR" ? 1 : -1;
  const pctMove = (livePrice - t.precioEntrada) / t.precioEntrada;
  return t.invertido * pctMove * t.apalancamiento * dirSign;
}
