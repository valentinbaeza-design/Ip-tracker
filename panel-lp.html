              : `${floating !== null ? `<span style="color:${floating>=0?'var(--teal)':'var(--coral)'}">${floating>=0?'+':''}$${floating.toFixed(2)} flotante</span><br>` : ""}<button class="btn-ghost btn-sm btn-close-instrument" data-id="${t.id}" data-instrument-key="${n.key}">Cerrar</button>`}
            <br><button class="btn-ghost btn-sm btn-delete-instrument" data-id="${t.id}" style="margin-top:4px">Eliminar</button>
          </span>
        </div>
      `}).join("")}
    </div>
  `;
}

function renderPosiciones(){
  const staleWarn = state.positionPricesAt && (Date.now() - state.positionPricesAt > 5 * 60 * 1000);
  const header = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px">
      <span class="muted">${state.positionPricesAt ? "Precios actualizados " + new Date(state.positionPricesAt).toLocaleTimeString("es-ES") + (staleWarn ? " (desactualizado)" : "") : "Precios no cargados"}</span>
      <div style="display:flex;gap:8px">
        <button class="btn-ghost btn-sm" id="btn-refresh-position-prices" ${state.positionPricesLoading || state.performanceLoading ? "disabled" : ""}>${state.positionPricesLoading || state.performanceLoading ? "Actualizando…" : "Actualizar"}</button>
      </div>
    </div>
    ${state.positionPricesError ? `<div class="err" style="margin-bottom:10px">Error al obtener precios: ${state.positionPricesError}</div>` : ""}
    ${state.performanceError ? `<div class="err" style="margin-bottom:10px">Error al obtener rendimiento: ${state.performanceError} (¿tiene el bot al menos 1 ejecución de check-positions.js completada?)</div>` : ""}
  `;
  const perfBlockFor = (tokenId) => {
    const perf = state.performance[tokenId];
    if(!perf) return `<div class="row"><span class="l">Rendimiento</span><span class="r muted">sin datos aún del bot (cada 4h)</span></div>`;
    const rt = perf.totalReturnPct;
    const rtColor = rt >= 0 ? "var(--teal)" : "var(--coral)";
    const position = POSITIONS.find(p => p.id === tokenId);
    const initialUSD = position ? parseFloat(position.deposit.replace(/[^\d,.-]/g, "").replace(",", ".")) : null;
    const gainUSD = (rt != null && initialUSD) ? (initialUSD * rt / 100) : null;
    const gainEUR = (gainUSD != null && state.eurRate) ? gainUSD * state.eurRate : null;
    const gainLine = gainUSD != null
      ? ` (${gainUSD >= 0 ? "+" : ""}$${gainUSD.toFixed(2)}${gainEUR != null ? ` · ${gainEUR >= 0 ? "+" : ""}€${gainEUR.toFixed(2)}` : ""})`
      : "";
    return `
      <div class="row"><span class="l">Valor posición</span><span class="r">${perf.positionValueUSD != null ? "$" + perf.positionValueUSD.toFixed(2) : "—"}</span></div>
      <div class="row"><span class="l">Fees acumuladas</span><span class="r">${perf.feesValueUSD != null ? "$" + perf.feesValueUSD.toFixed(2) : "—"}</span></div>
      <div class="row"><span class="l">Rendimiento total</span><span class="r" style="color:${rtColor}">${rt != null ? (rt >= 0 ? "+" : "") + rt.toFixed(2) + "%" : "—"}${gainLine}</span></div>
      <div class="row"><span class="l">Actualizado (bot)</span><span class="r muted" style="font-size:11px">${perf.t ? new Date(perf.t).toLocaleString("es-ES") : "—"}</span></div>
    `;
  };

  // Construye una fila de datos planos por posición, para poder ordenar la tabla
  // por cualquier columna sin recalcular nada en el click.
  const rows = POSITIONS.map((p, idx) => {
    const live = computePositionLive(p);
    const perf = state.performance[p.id];
    const initialUSD = parseFloat(p.deposit.replace(/[^\d,.-]/g, "").replace(",", "."));
    const gainUSD = (perf && perf.totalReturnPct != null) ? (initialUSD * perf.totalReturnPct / 100) : null;
    const gainEUR = (gainUSD != null && state.eurRate) ? gainUSD * state.eurRate : null;
    const daysOpen = daysActive(p.openedAt);
    return {
      idx, id: p.id, pair: p.pair, network: p.network, fee: p.fee, range: p.range, deposit: initialUSD,
      livePrice: live ? live.livePrice : null, inRange: live ? live.inRange : null,
      marginLow: live ? live.marginLowPct : null, marginHigh: live ? live.marginHighPct : null,
      positionValue: perf ? perf.positionValueUSD : null, fees: perf ? perf.feesValueUSD : null,
      returnPct: perf ? perf.totalReturnPct : null, gainUSD, gainEUR, daysOpen,
      vsHoldUSD: perf && perf.vsHoldUSD !== undefined ? perf.vsHoldUSD : null,
      vsHoldPct: (perf && perf.vsHoldUSD !== undefined && perf.vsHoldUSD !== null && initialUSD > 0) ? (perf.vsHoldUSD / initialUSD) * 100 : null,
      entryPriceUsed: perf ? !!perf.entryPriceUsed : false,
      updatedAt: perf ? perf.t : null
    };
  });

  const sortKey = state.posicionesSort.key, sortDir = state.posicionesSort.dir;
  const sorted = [...rows].sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if(va == null && vb == null) return 0;
    if(va == null) return 1;
    if(vb == null) return -1;
    if(typeof va === "string") return sortDir === "asc" ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === "asc" ? va - vb : vb - va;
  });

  const columns = [
    { key: "pair", label: "Par" },
    { key: "network", label: "Red" },
    { key: "range", label: "Rango" },
    { key: "daysOpen", label: "Días activa" },
    { key: "deposit", label: "Depósito" },
    { key: "livePrice", label: "Precio vivo" },
    { key: "marginLow", label: "Margen mín." },
    { key: "marginHigh", label: "Margen máx." },
    { key: "positionValue", label: "Valor" },
    { key: "fees", label: "Fees" },
    { key: "returnPct", label: "Rendim." },
    { key: "vsHoldUSD", label: "vs Hold" },
  ];
  const arrow = (key) => sortKey === key ? `<span class="sort-arrow">${sortDir === "asc" ? "▲" : "▼"}</span>` : "";
  const fmtMoney = (v) => v == null ? "—" : "$" + v.toFixed(2);
  const fmtFees = (v) => v == null ? "—" : "$" + v.toFixed(5);
  const fmtPct = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";

  const validRows = rows.filter(r => r.deposit != null);
  const totalDeposit = validRows.reduce((a, r) => a + r.deposit, 0);
  const rowsWithValue = rows.filter(r => r.positionValue != null);
  const totalValue = rowsWithValue.length ? rowsWithValue.reduce((a, r) => a + r.positionValue, 0) : null;
  const rowsWithFees = rows.filter(r => r.fees != null);
  const totalFees = rowsWithFees.length ? rowsWithFees.reduce((a, r) => a + r.fees, 0) : null;
  const rowsWithGain = rows.filter(r => r.gainUSD != null);
  const totalGainUSD = rowsWithGain.length ? rowsWithGain.reduce((a, r) => a + r.gainUSD, 0) : null;
  const totalGainEUR = (totalGainUSD != null && state.eurRate) ? totalGainUSD * state.eurRate : null;
  const totalDepositForGain = rowsWithGain.reduce((a, r) => a + r.deposit, 0);
  const totalReturnPct = (totalGainUSD != null && totalDepositForGain > 0) ? (totalGainUSD / totalDepositForGain) * 100 : null;
  const someMissing = rows.length !== rowsWithGain.length;

  const table = `
    <div class="pos-table-wrap">
      <table class="pos-table">
        <thead><tr>
          ${columns.map(c => `<th data-sort-key="${c.key}">${c.key === "vsHoldUSD" ? `<span class="ttip" tabindex="0">${c.label}<span class="ttip-card"><div class="ttip-title">¿Qué es "vs Hold"?</div><div class="ttip-row" style="display:block">Cuánto has ganado o perdido por proveer liquidez (fees menos impermanent loss), separado del simple movimiento de precio. Pasa el ratón por el valor de cada fila para ver el desglose completo.</div></span></span>` : c.label}${arrow(c.key)}</th>`).join("")}
          <th>Estado</th>
          <th>Acciones</th>
        </tr></thead>
        <tbody>
          ${sorted.map(r => `
            <tr>
              <td class="name-cell">${r.pair} <span class="num">#${r.id}</span></td>
              <td>${r.network}</td>
              <td>${r.range}</td>
              <td>${r.daysOpen != null ? r.daysOpen.toFixed(1) : "—"}</td>
              <td>${fmtMoney(r.deposit)}</td>
              <td>${r.livePrice != null ? formatPrice(r.livePrice) : "—"}</td>
              <td>${r.marginLow != null ? r.marginLow.toFixed(2) + "%" : "—"}</td>
              <td>${r.marginHigh != null ? r.marginHigh.toFixed(2) + "%" : "—"}</td>
              <td>${fmtMoney(r.positionValue)}</td>
              <td>${fmtFees(r.fees)}</td>
              <td style="color:${r.returnPct == null ? 'inherit' : r.returnPct >= 0 ? 'var(--teal)' : 'var(--coral)'}">
                ${fmtPct(r.returnPct)}${r.gainUSD != null ? `<br><span style="font-size:10px;opacity:0.8">${r.gainUSD >= 0 ? "+" : ""}$${r.gainUSD.toFixed(2)}${r.gainEUR != null ? ` · ${r.gainEUR >= 0 ? "+" : ""}€${r.gainEUR.toFixed(2)}` : ""}</span>` : ""}
              </td>
              <td>
                <span class="ttip" tabindex="0" style="color:${r.vsHoldUSD == null ? 'inherit' : r.vsHoldUSD >= 0 ? 'var(--teal)' : 'var(--coral)'}">
                  ${r.vsHoldUSD != null ? (r.vsHoldUSD >= 0 ? "+" : "") + "$" + r.vsHoldUSD.toFixed(2) : "—"}${r.vsHoldPct != null ? `<br><span style="font-size:10px;opacity:0.8">${r.vsHoldPct >= 0 ? "+" : ""}${r.vsHoldPct.toFixed(2)}%</span>` : ""}
                  <span class="ttip-card">${buildVsHoldTooltip(r)}</span>
                </span>
              </td>
              <td><span class="chip ${r.inRange ? "in" : r.inRange === false ? "out" : ""}">${r.inRange == null ? "—" : r.inRange ? "dentro" : "fuera"}</span></td>
              <td>
                <a class="link-btn" href="https://app.uniswap.org/positions" target="_blank"><button class="btn-ghost btn-sm">Uniswap</button></a>
                <button class="btn-gold btn-sm btn-analyze-position" data-idx="${r.idx}">Analizar</button>
                <button class="btn-ghost btn-sm btn-delete-position" data-idx="${r.idx}" style="color:var(--coral)">Eliminar</button>
              </td>
            </tr>
          `).join("")}
        </tbody>
        <tfoot>
          <tr style="border-top:2px solid var(--gold)">
            <td class="name-cell" style="font-weight:600">Total</td>
            <td></td>
            <td></td>
            <td></td>
            <td style="font-weight:600">${fmtMoney(totalDeposit)}</td>
            <td></td>
            <td></td>
            <td></td>
            <td style="font-weight:600">${fmtMoney(totalValue)}</td>
            <td style="font-weight:600">${fmtFees(totalFees)}</td>
            <td style="color:${totalReturnPct == null ? 'inherit' : totalReturnPct >= 0 ? 'var(--teal)' : 'var(--coral)'};font-weight:600">
              ${fmtPct(totalReturnPct)}${totalGainUSD != null ? `<br><span style="font-size:10px;opacity:0.8">${totalGainUSD >= 0 ? "+" : ""}$${totalGainUSD.toFixed(2)}${totalGainEUR != null ? ` · ${totalGainEUR >= 0 ? "+" : ""}€${totalGainEUR.toFixed(2)}` : ""}</span>` : ""}
            </td>
            <td></td>
            <td></td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    <p class="muted" style="font-size:11px;margin:-4px 0 12px">Toca cualquier cabecera para ordenar. Actualizado (bot): ${sorted[0] && sorted[0].updatedAt ? new Date(sorted[0].updatedAt).toLocaleString("es-ES") : "sin datos aún"}.${someMissing ? " El total de Rendim. usa solo las posiciones con datos del bot disponibles." : ""}</p>
  `;


  // La comparativa ancho vs estrecho (#5759912 vs #5786604) queda retirada: ambas posiciones
  // se cerraron el 20/08/2026 y se consolidaron en #5821654. Si se reabre el experimento de
  // comparación de rangos en el futuro (ver Master System, próximos pasos), reintroducir aquí
  // un bloque equivalente apuntando a los nuevos IDs.

  const manage = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">Gestionar posiciones <span class="num">config.json</span></h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="muted" style="font-size:11px">${state.positionsSyncStatus || ""}</span>
          <button class="btn-ghost btn-sm" id="btn-sync-positions-pull">Sincronizar desde GitHub</button>
        </div>
      </div>
      <p class="muted" style="margin:8px 0">Esta tabla y <code>config.json</code> del repo (que usa el bot cada 4h) son la misma fuente. Añadir o eliminar aquí actualiza el bot automáticamente${state.githubTokenPlain ? "" : " (necesitas desbloquear el token de GitHub para escribir; de momento solo puedes sincronizar en modo lectura)"}.</p>
      ${!state.showAddPosition ? `
        <button class="btn-gold btn-sm" id="btn-toggle-add-position">+ Añadir posición nueva</button>
      ` : `
        <div class="grid2" style="margin-top:8px">
          <div><label>Par (ej. WETH/USDC)</label><input type="text" id="np-pair" value="${escapeAttr(state.newPositionForm.pair)}" placeholder="WETH/USDC"></div>
          <div><label>Red</label>
            <select id="np-network">
              <option value="base" ${state.newPositionForm.network === "base" ? "selected" : ""}>Base</option>
              <option value="arbitrum" ${state.newPositionForm.network === "arbitrum" ? "selected" : ""}>Arbitrum</option>
              <option value="ethereum" ${state.newPositionForm.network === "ethereum" ? "selected" : ""}>Ethereum</option>
              <option value="polygon" ${state.newPositionForm.network === "polygon" ? "selected" : ""}>Polygon</option>
            </select>
          </div>
          <div><label>NFT / tokenId</label><input type="text" id="np-tokenid" value="${escapeAttr(state.newPositionForm.tokenId)}" placeholder="5821654"></div>
          <div><label>Depósito inicial (US$)</label><input type="text" id="np-initialusd" value="${escapeAttr(state.newPositionForm.initialUSD)}" placeholder="69.84"></div>

          <div><label>Precio máximo del rango</label><input type="text" id="np-rangemax" value="${escapeAttr(state.newPositionForm.rangeMax)}" placeholder="2724.41"></div>

          <div><label>Modo de precio</label>
            <select id="np-pricemode">
              <option value="direct" ${state.newPositionForm.priceMode === "direct" ? "selected" : ""}>Directo (par contra stablecoin, ej. ETH/USDC)</option>
              <option value="ratio" ${state.newPositionForm.priceMode === "ratio" ? "selected" : ""}>Ratio (par entre dos cripto, ej. ETH/ARB)</option>
            </select>
          </div>
          <div><label>Símbolos Binance (coma si son 2, modo ratio)</label><input type="text" id="np-pricesymbols" value="${escapeAttr(state.newPositionForm.priceSymbols)}" placeholder="ETHUSDT o ETHUSDT,ARBUSDT"></div>
          <div><label>Símbolo para análisis (Binance)</label><input type="text" id="np-analysissymbol" value="${escapeAttr(state.newPositionForm.analysisSymbol)}" placeholder="ETHUSDT"></div>
        </div>
        <p class="muted" style="font-size:11px;margin:8px 0">RPC, gestor de posiciones (Position Manager) y factory se rellenan automáticamente según la red elegida (presets verificados) — no hace falta teclearlos.</p>
        <div style="display:flex;gap:8px;margin-top:8px">
          <button class="btn-gold btn-sm" id="btn-add-position">Añadir${state.githubTokenPlain ? " y sincronizar" : " (solo local)"}</button>
          <button class="btn-ghost btn-sm" id="btn-cancel-add-position">Cancelar</button>
        </div>
      `}
      ${!state.githubTokenPlain ? `
        <p class="muted" style="margin:12px 0 0;font-size:11px">Sincronización automática desactivada (token de GitHub no desbloqueado). Alternativa manual — copia esto en <code>config.json</code> de tu repo:</p>

      ` : ""}

  return header + table + manage + speculativeSection();
}

function renderBalanceLP(){
  const fmtMoney = (v) => v == null ? "—" : "$" + v.toFixed(2);
  const fmtPct = (v) => v == null ? "—" : (v >= 0 ? "+" : "") + v.toFixed(2) + "%";

  // Fila "abierta" por cada posición activa, con su rendimiento actual (no realizado).
  const openRows = POSITIONS.map(p => {
    const perf = state.performance[p.id];
    const days = daysActive(p.openedAt);
    return {
      status: "abierta", pair: p.pair, network: p.network, id: p.id,
      openedAt: p.openedAt, closedAt: null, days,
      initialUSD: p.initialUSD, finalUSD: perf ? perf.positionValueUSD : null,
      feesUSD: perf ? perf.feesValueUSD : null,
      returnPct: perf ? perf.totalReturnPct : null, note: p.note || ""
    };
  });
  // Filas de cierres reales, leídas de closed-positions.json.
  const closedRows = state.closedPositions.map(c => {
    const days = daysActive(c.openedAt, c.closedAt);
    const returnPct = (c.initialUSD && c.finalUSD != null) ? ((c.finalUSD - c.initialUSD) / c.initialUSD) * 100 : null;
    return {
      status: "cerrada", pair: c.pair, network: c.network, id: c.tokenId,
      openedAt: c.openedAt, closedAt: c.closedAt, days,
      initialUSD: c.initialUSD, finalUSD: c.finalUSD, feesUSD: c.feesUSD ?? null,
      returnPct, note: c.note || ""
    };
  });
  const allRows = [...closedRows, ...openRows];

  const totalInvested = allRows.reduce((a, r) => a + (r.initialUSD || 0), 0);
  const totalRealizedClosed = closedRows.reduce((a, r) => a + (r.finalUSD != null ? r.finalUSD : (r.initialUSD || 0)), 0);
  const totalValueOpen = openRows.reduce((a, r) => a + (r.finalUSD != null ? r.finalUSD : 0), 0);
  const totalCurrentWorth = totalRealizedClosed + totalValueOpen;
  const totalGainUSD = totalCurrentWorth - totalInvested;
  const totalGainPct = totalInvested > 0 ? (totalGainUSD / totalInvested) * 100 : null;

  const summary = `
    <div class="card">
      <h2 style="margin-top:0">Resumen histórico</h2>
      <div class="row"><span class="l">Total invertido (histórico, abiertas + cerradas)</span><span class="r">${fmtMoney(totalInvested)}</span></div>
      <div class="row"><span class="l">Recuperado en cierres</span><span class="r">${fmtMoney(totalRealizedClosed)}</span></div>
      <div class="row"><span class="l">Valor actual de lo que sigue abierto</span><span class="r">${fmtMoney(totalValueOpen)}</span></div>
      <div class="row"><span class="l" style="font-weight:600;color:var(--text)">Resultado total (realizado + no realizado)</span><span class="r" style="color:${totalGainUSD>=0?'var(--teal)':'var(--coral)'};font-weight:600">${totalGainUSD>=0?'+':''}${fmtMoney(totalGainUSD)}${totalGainPct!=null?` (${fmtPct(totalGainPct)})`:''}</span></div>
      <p class="muted" style="font-size:11px;margin:8px 0 0">Los cierres se registran a mano (o desde el botón Eliminar de Posiciones) — la precisión depende de los importes que se anoten al cerrar cada posición.</p>
    </div>`;

  const rows = allRows.map(r => `
    <tr>
      <td class="name-cell">${r.pair} <span class="num">#${r.id}</span></td>
      <td>${r.network}</td>
      <td><span class="chip ${r.status === 'abierta' ? 'in' : ''}">${r.status}</span></td>
      <td>${r.openedAt ? new Date(r.openedAt).toLocaleDateString("es-ES") : "—"}</td>
      <td>${r.closedAt ? new Date(r.closedAt).toLocaleDateString("es-ES") : "—"}</td>
      <td>${r.days != null ? r.days.toFixed(1) : "—"}</td>
      <td>${fmtMoney(r.initialUSD)}</td>
      <td>${fmtMoney(r.finalUSD)}</td>
      <td>${r.feesUSD != null ? "$" + r.feesUSD.toFixed(5) : "—"}</td>
      <td style="color:${r.returnPct == null ? 'inherit' : r.returnPct >= 0 ? 'var(--teal)' : 'var(--coral)'}">${fmtPct(r.returnPct)}</td>
      <td class="muted" style="font-size:11px">${r.note ? escapeHtml(r.note) : ""}</td>
    </tr>
  `).join("");

  const table = allRows.length === 0 ? `<p class="muted">Todavía no hay posiciones (ni abiertas ni cerradas) que mostrar.</p>` : `
    <div class="pos-table-wrap">
      <table class="pos-table">
        <thead><tr>
          <th>Par</th><th>Red</th><th>Estado</th><th>Apertura</th><th>Cierre</th><th>Días</th>
          <th>Depósito inicial</th><th>Valor final/actual</th><th>Fees</th><th>Rendim.</th><th>Nota</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  const addForm = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <h2 style="margin:0">Registrar cierre <span class="num">closed-positions.json</span></h2>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="muted" style="font-size:11px">${state.closedPositionsSyncStatus || ""}</span>
          <button class="btn-ghost btn-sm" id="btn-sync-closed-pull">Sincronizar desde GitHub</button>
        </div>
      </div>
      <p class="muted" style="margin:8px 0">Para posiciones cerradas fuera del panel (o antes de tener este historial), regístralas aquí a mano.</p>
      ${!state.showAddClosedPosition ? `
        <button class="btn-gold btn-sm" id="btn-toggle-add-closed">+ Registrar cierre</button>
      ` : `
        <div class="grid2" style="margin-top:8px">
          <div><label>Par</label><input type="text" id="cp-pair" value="${escapeAttr(state.newClosedPositionForm.pair)}" placeholder="WETH/USDC"></div>
          <div><label>Red</label><input type="text" id="cp-network" value="${escapeAttr(state.newClosedPositionForm.network)}" placeholder="Base"></div>

function speculativeSection(){
  const openTrades = [];
  Object.values(state.instruments).forEach(instr => {
    instr.trades.filter(t => !t.cerrado).forEach(t => {
      openTrades.push({ instr, t });
    });
  });
  if(openTrades.length === 0){
    return `<div class="card"><h2>Trading especulativo abierto</h2><p class="muted" style="margin:0">Sin operaciones abiertas registradas. El panel no lee tu cuenta de eToro directamente — cuando una orden se ejecute, regístrala en <b>Especulación → Añadir operación</b> y aparecerá aquí automáticamente.</p></div>`;
  }
  const fmtMoney = (v) => v == null ? "—" : "$" + v.toFixed(2);
  const rowsHtml = openTrades.map(({ instr, t }) => {
    const floating = calcFloatingPnl(t, instr.livePrice);
    const floatingPct = floating != null ? (floating / t.invertido) * 100 : null;
    const floatingEUR = (floating != null && state.eurRate) ? floating * state.eurRate : null;
    return `
      <tr>
        <td class="name-cell">${instr.label}</td>
        <td style="color:${t.direccion==='COMPRAR'?'var(--teal)':'var(--coral)'}">${t.direccion}</td>
        <td>${t.precioEntrada}</td>
        <td>${t.precioSL ?? "—"}</td>
        <td>${t.precioTP ?? "—"}</td>
        <td>${t.apalancamiento}x</td>
        <td>${fmtMoney(t.invertido)}</td>
        <td>${instr.livePrice != null ? instr.livePrice : "—"}</td>
        <td style="color:${floating == null ? 'inherit' : floating >= 0 ? 'var(--teal)' : 'var(--coral)'}">
          ${floating != null ? `${floating>=0?'+':''}${floatingPct.toFixed(2)}%<br><span style="font-size:10px;opacity:0.8">${floating>=0?'+':''}$${floating.toFixed(2)}${floatingEUR!=null?` · ${floatingEUR>=0?'+':''}€${floatingEUR.toFixed(2)}`:''}</span>` : "—"}
        </td>
        <td>${t.nota ? escapeHtml(t.nota) : "—"}</td>
        <td><button class="btn-ghost btn-sm btn-close-instrument" data-id="${t.id}" data-instrument-key="${instr.key}">Cerrar</button></td>
      </tr>
    `;
  }).join("");
  return `
    <div class="pos-table-wrap">
      <table class="pos-table">
        <caption style="caption-side:top;text-align:left;padding:0 0 8px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--text)">Trading especulativo abierto</caption>
        <thead><tr>
          <th>Instrumento</th><th>Dirección</th><th>Entrada</th><th>SL</th><th>TP</th><th>Apalanc.</th><th>Importe</th><th>Precio vivo</th><th>P&L flotante</th><th>Nota</th><th>Acciones</th>
        </tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    <p class="muted" style="font-size:11px;margin:-4px 0 12px">Datos registrados manualmente en Especulación — el panel no lee tu cuenta de eToro directamente.</p>
  `;
}

        ` : `<div style="margin-top:8px"><button class="btn-ghost btn-sm" id="btn-forget-av-key">Olvidar clave guardada</button></div>`}

        <label>Contraseña para cifrarla</label>

        <button class="btn-gold btn-sm" id="btn-save-av-apikey">Guardar cifrada</button>
      `}
      ${state.alphaVantageApiStatus ? `<p class="${state.alphaVantageApiStatus.startsWith('Error') ? 'err' : 'ok'}" style="margin-top:8px">${state.alphaVantageApiStatus}</p>` : ""}
    </div>

    </div>
  `;
}

  // Como .ttip-card usa position:fixed (para escapar del recorte del scroll horizontal de la
  // tabla), hay que calcular su posición en pantalla a mano, aquí, cada vez que se abre.
  function positionTtipCard(trigger){
    const card = trigger.querySelector(".ttip-card");
    if(!card) return;
    const rect = trigger.getBoundingClientRect();
    const cardWidth = card.offsetWidth || 280;
    let left = rect.left + rect.width / 2 - cardWidth / 2;
    left = Math.max(8, Math.min(left, window.innerWidth - cardWidth - 8));
    let top = rect.top - card.offsetHeight - 10;
    if(top < 8) top = rect.bottom + 10; // si no cabe arriba, se abre hacia abajo
    card.style.left = left + "px";
    card.style.top = top + "px";
  }

      if(!wasOpen){ t.classList.add("ttip-open"); positionTtipCard(t); }

  });

    state.portfolioHoldings = [...state.portfolioHoldings, holding];
    await storeSet("portfolio-holdings", state.portfolioHoldings);
    setState({ showAddHolding: false, newHoldingForm: { assetKey: "renta_variable", product: "", date: new Date().toISOString().slice(0, 10), investedEUR: "", valuationMode: "manual", symbol: "", units: "", manualCurrentValueEUR: "" } });
    if(holding.valuationMode === "binance") fetchPortfolioLivePrices().then(render);
  });

  document.querySelectorAll(".btn-delete-holding").forEach(btn => {
    btn.addEventListener("click", async () => {
      const idx = parseInt(btn.dataset.idx, 10);
      if(!confirm("¿Eliminar esta compra del registro?")) return;
      state.portfolioHoldings = state.portfolioHoldings.filter((_, i) => i !== idx);
      await storeSet("portfolio-holdings", state.portfolioHoldings);
      render();
    });
  });
  document.querySelectorAll(".history-filter-chip").forEach(btn => {
    btn.addEventListener("click", () => setState({ historyFilter: btn.dataset.asset }));
  });
  const clearFilterBtn = document.getElementById("btn-clear-history-filter");
  if(clearFilterBtn) clearFilterBtn.addEventListener("click", () => setState({ historyFilter: "" }));
  const syncGeoBtn = document.getElementById("btn-sync-geo");
  if(syncGeoBtn) syncGeoBtn.addEventListener("click", syncGeoFromGithub);
  document.querySelectorAll(".btn-delete-history").forEach(btn => {
    btn.addEventListener("click", async () => {
      const newHistory = state.history.filter(h => h.id !== btn.dataset.id);
      setState({ history: newHistory });
      await storeSet("historical-events", newHistory);
    });
  });

  const chatlog = document.getElementById("chatlog");
  if(chatlog) chatlog.scrollTop = chatlog.scrollHeight;
}

init();

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(state.tab === "trading" && state.trading.candles) drawChart(); }, 200);
});
</script>
</body>
</html>
